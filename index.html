<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Fly Starship to Mars and back: launch from Starbase, mine asteroids in orbit, land at Jezero, drive the rover, grow a Mars base and land home."><meta name="theme-color" content="#06080c"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Mars Round Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed flight canvas, telemetry overlay top-left, thumb controls along the bottom edge */
:root{
  --bg:#06080c; --panel:rgba(10,14,20,.84); --line:#26303c; --fg:#e9edf0; --dim:#8a96a2;
  --hot:#ff6a1f; --cool:#69d3ff; --ok:#62de88; --warn:#ffc23d; --bad:#ff4b4b; --steel:#c9d1d8;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--mono);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

#hud{position:absolute;inset:0;pointer-events:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px}
.top{text-shadow:0 1px 3px rgba(0,0,0,.75),0 0 10px rgba(0,0,0,.35);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#ph{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#ph small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.04em;color:#dfe6ec;text-transform:none;margin-top:4px;max-width:62ch}
#clock{font-size:12px;color:#dfe6ec;font-variant-numeric:tabular-nums;white-space:nowrap}
.side{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));width:92px;display:grid;gap:7px;background:rgba(8,12,18,.55);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px;backdrop-filter:blur(3px)}
.side.left{left:max(10px,env(safe-area-inset-left,0px))}
.side.right{right:max(10px,env(safe-area-inset-right,0px))}
.cell{display:grid;gap:2px;font-variant-numeric:tabular-nums}
.k{font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.cell b{font-size:14px;font-weight:600;line-height:1.1}
.cell small{font-size:10px;color:var(--dim)}
.cell.done b{color:var(--ok)}
#kits:empty{display:none}
#kits{color:var(--ok)}
.bar{height:6px;background:#1a222c;border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cool);border-radius:3px}
.bar.fuel i{background:linear-gradient(90deg,#3fb6ff,#9fe7ff)}
.bar.heat i{background:linear-gradient(90deg,var(--warn),var(--hot),var(--bad))}
.lab{display:flex;justify-content:space-between;color:var(--dim);letter-spacing:.08em;font-size:10px}
#engs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;pointer-events:auto}
.eng{background:#121922;border:1px solid var(--line);border-radius:4px;padding:4px 0 3px;display:grid;gap:3px;justify-items:center;font-size:8.5px;letter-spacing:0;pointer-events:auto;min-width:0}
.vbar{width:8px;height:58px;background:#1a222c;border-radius:3px;overflow:hidden;position:relative}
.vbar i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--warn),var(--hot) 60%,var(--bad))}
.eng .t{font-weight:600}
.eng.vac .t{color:var(--cool)}
.eng.sl .t{color:#ffb27a}
.eng.firing{border-color:var(--hot)}
.eng.hot{animation:blink .35s steps(2) infinite}
.eng.dmg{background:#2a1214;border-color:var(--bad)}
.eng.dmg .t{color:var(--bad)}
.eng.fixable{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
@keyframes blink{50%{border-color:var(--bad);background:#2a1214}}
#toast{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,34px);
  letter-spacing:.05em;text-transform:uppercase;text-align:center;text-shadow:0 2px 12px #000;opacity:0;transition:opacity .25s;width:90%;text-wrap:balance}
#toast.on{opacity:1}

#ctl{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:54px 54px minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr);gap:7px;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.65) 40%)}
#ctl button{min-width:0;padding:0 4px;height:64px;border-radius:10px;border:1px solid #3a4654;background:rgba(18,24,32,.9);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;touch-action:none}
#ctl button.on{background:#28323e;border-color:var(--cool)}
#ctl #bThr{background:linear-gradient(#ff7a2e,#d9480f);border-color:#ff9a5c;color:#fff;font-size:18px}
#ctl #bThr.on{filter:brightness(1.25)}
#ctl #bAct{border-color:var(--warn);color:var(--warn)}
#ctl #bAct:disabled{opacity:.3}
#ctl .arrow{font-size:24px}
#mode small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.1em}

/* overlays */
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,6,9,.78);backdrop-filter:blur(3px);padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(520px,100%);background:#0c1117;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--hot);text-transform:uppercase}
.card h1,.card h2{font-family:var(--display);font-weight:800;letter-spacing:.03em;margin:0;line-height:.95;text-wrap:balance;text-transform:uppercase}
.card h1{font-size:clamp(40px,11vw,64px)}
.card h2{font-size:clamp(28px,7vw,38px)}
.card p{margin:0;color:#c3ccd4;font-size:13px;line-height:1.55;max-width:62ch}
.card ul{margin:0;padding-left:18px;color:#c3ccd4;font-size:12.5px;line-height:1.6}
.card ul b{color:var(--fg)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;height:52px;border-radius:8px;border:1px solid #ff9a5c;background:linear-gradient(#ff7a2e,#d9480f);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.btn.ghost{background:transparent;border-color:#3a4654;color:var(--fg)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rk{border:1px solid var(--line);background:#0f151c;border-radius:10px;padding:8px 4px 9px;display:grid;justify-items:center;gap:2px;min-width:0}
.rk canvas{width:100%;max-width:90px;height:124px;display:block}
.rk b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;text-align:center}
.rk small{font-size:10px;color:var(--dim)}
.rk.on{border-color:var(--hot);background:#1a1410;box-shadow:0 0 0 1px var(--hot)}
.rkinfo{display:grid;gap:8px;background:#0f151c;border:1px solid var(--line);border-radius:8px;padding:12px}
.rkinfo h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.rkinfo .tag{font-size:11px;color:var(--hot);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.sbars{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;align-items:center;font-size:11px;color:var(--dim)}
.pips{display:flex;gap:3px}
.pips i{width:100%;max-width:26px;height:6px;border-radius:2px;background:#222b35}
.pips i.f{background:var(--cool)}
.slot{min-width:0;height:86px;border-radius:8px;border:1px solid var(--line);background:#121922;display:grid;place-items:center;align-content:center;gap:4px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em}
.slot small{font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.06em;color:var(--dim)}
.slot.sl{color:#ffb27a;border-color:#6b3c22}
.slot.vac{color:var(--cool);border-color:#1f4f66}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.stat{background:#121922;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:2px}
.stat span{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.stat b{font-size:18px;font-variant-numeric:tabular-nums}
.warnline{font-size:12px;color:var(--warn);line-height:1.5}
.keys{font-size:11px;color:var(--dim);line-height:1.6}

/* surface ops */
#mine{position:absolute;left:0;right:0;bottom:0;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.78) 22%);display:grid;gap:8px}
#mine .mrow{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
#storm{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.05em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#storm.near{color:var(--bad)}
#cargo{font-size:11px;letter-spacing:.06em;color:#dfe6ec;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:11px}
.mbig{display:grid;grid-template-columns:56px 56px minmax(0,1fr) minmax(0,1fr);gap:7px}
.mbig button{min-width:0;padding:0 4px;height:60px;border-radius:10px;border:1px solid #3a4654;background:rgba(18,24,32,.92);font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;touch-action:none;line-height:1.05}
.mbig .arrow{font-size:24px}
.mbig button.on{background:#28323e;border-color:var(--cool)}
#bDo{border-color:var(--cool);color:var(--cool)}
#bDo.on{filter:brightness(1.3)}
#bDo:disabled{opacity:.35}
#bLaunch{background:linear-gradient(#ff7a2e,#d9480f);border:1px solid #ff9a5c;color:#fff}
#bLaunch:disabled{opacity:.4;filter:saturate(.4)}
.marker{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ok)}
#capcom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:rgba(8,12,18,.82);border:1px solid rgba(105,211,255,.35);border-left:3px solid var(--cool);border-radius:6px;padding:7px 10px;font-size:11.5px;line-height:1.45;opacity:0;transition:opacity .3s;display:grid;gap:2px}
#capcom b{font-size:9.5px;letter-spacing:.16em;color:var(--cool);font-weight:600}
#capcom.on{opacity:1}
#capcom.alert{border-color:rgba(255,75,75,.5);border-left-color:var(--bad)}
#capcom.alert b{color:var(--bad)}
body.surface #capcom{bottom:calc(178px + env(safe-area-inset-bottom,0px))}
.tr{display:flex;gap:8px;align-items:flex-start}
#snd,#tac,#rst{pointer-events:auto;white-space:nowrap;border:1px solid rgba(255,255,255,.18);background:rgba(8,12,18,.6);border-radius:6px;font-size:9.5px;letter-spacing:.1em;padding:4px 6px;color:#dfe6ec}
#snd.off,#tac.off{color:var(--dim)}
#toast.big{font-size:clamp(48px,16vw,96px);top:26%}
.cargo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.cargo{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mbig button:disabled{opacity:.35}
.cg{min-width:0;border:1px solid var(--line);background:#0f151c;border-radius:8px;padding:8px 6px;display:grid;gap:3px;text-align:left}
.cg b{overflow-wrap:anywhere;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.cg small{font-size:9.5px;color:var(--dim);line-height:1.35}
.cg .n{font-size:9.5px;color:var(--ok)}
.cg.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok);background:#0f1a14}
.cg:disabled{opacity:.4}
.base{display:grid;gap:6px;background:#0f151c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11.5px;color:#c3ccd4}
.base .row2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.base h3{margin:0;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
.base .mini{border:1px solid #3a4654;background:transparent;border-radius:6px;font-size:10px;padding:4px 8px;color:var(--dim)}
.base .mini.arm{border-color:var(--bad);color:var(--bad)}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{border:1px solid #3a4654;background:transparent;border-radius:6px;font-size:11px;padding:6px 10px;color:var(--fg)}
.tg[aria-pressed="false"]{color:var(--dim)}
.tg[aria-pressed="true"]{border-color:var(--cool)}
[hidden]{display:none!important}
#zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(300px + env(safe-area-inset-top,0px));display:grid;gap:6px}
#zoom button{width:44px;height:44px;border-radius:10px;border:1px solid #3a4654;background:rgba(18,24,32,.88);font-family:var(--display);font-weight:700;font-size:26px;line-height:1;touch-action:none}
#zoom button.on{border-color:var(--cool)}
#zoom #zFit{font-size:12px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.eng.hot{animation:none;border-color:var(--bad)}#toast{transition:none}}
@media (min-width:760px){#ctl{grid-template-columns:80px 80px 140px 140px 220px;justify-content:center}}
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div class="top">
      <div id="ph">Earth Ascent<small id="obj"></small></div>
      <div class="tr"><div id="clock">T+00:00</div><button id="rst" aria-label="Restart or pause">↻ RESTART</button><button id="tac" aria-label="Toggle tactical HUD">HUD</button><button id="snd" aria-label="Toggle sound">SOUND</button></div>
    </div>
    <div class="side left" id="sideL">
      <div class="cell" id="rA"><span class="k" id="kA">ALT</span><b id="vA">0</b><small id="tA"></small></div>
      <div class="cell" id="rH"><span class="k" id="kH">H-SPD</span><b id="vH">0</b><small id="tH"></small></div>
      <div class="cell"><span class="k" id="kV">V-SPD</span><b id="vV">0</b></div>
      <div class="cell"><span class="k">FUEL</span><b id="vF">100%</b><div class="bar fuel"><i id="bF"></i></div></div>
    </div>
    <div class="side right">
      <div class="cell"><span class="k">ENGINE HEAT</span></div>
      <div id="engs"></div>
      <div class="k" id="kits"></div>
      <div id="xtra" class="cell"><span class="k" id="xL">BOOSTER</span><b id="xV"></b><div class="bar heat"><i id="xB"></i></div></div>
      <div id="xtra2" class="cell"><span class="k" id="x2L">BOOSTER FUEL</span><b id="x2V"></b><div class="bar fuel"><i id="x2B"></i></div></div>
    </div>

  </div>
  <div id="ctl" hidden>

    <button id="bR" class="arrow" data-k="right" aria-label="Rotate right">▶</button>
    <button id="mode" aria-label="Engine mode">ALL<small>ENGINES</small></button>

      <div><div class="lab"><span>SHIP FUEL</span><span id="mfV"></span></div><div class="bar fuel" style="height:9px"><i id="mfB"></i><span class="marker" id="mfM"></span></div></div>
      <div><div class="lab"><span id="rfL">REFINERY IDLE</span><span id="rfV"></span></div><div class="bar" style="height:9px"><i id="rfB" style="background:linear-gradient(90deg,#3fd07a,#a6f0c0)"></i></div></div>
    </div>
    <div class="mbig"><button class="arrow" data-k="left" aria-label="Drive left">◀</button><button class="arrow" data-k="right" aria-label="Drive right">▶</button><button id="bDo">Dig</button><button id="bLaunch">Launch</button></div>
  </div>
  <div class="ov" id="ov" hidden><div class="card" id="card"></div></div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const clone=o=>JSON.parse(JSON.stringify(o));
const wrap=d=>((d+540)%360)-180;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- planets ---------- */
const EARTH={id:'earth',g:6,dens:a=>Math.exp(-Math.max(0,a)/700),ground:x=>Math.abs(x)<=13?22:0};
const MARS_X0=-3000,MARS_STEP=10,MARS_N=900;
const ZONES=[{x0:-380,x1:-280},{x0:330,x1:430},{x0:860,x1:1040,base:true},{x0:1040,x1:1220,ice:true},{x0:1220,x1:1400,base:true},{x0:1850,x1:1960},{x0:2700,x1:2800,ice:true}];
const marsArr=new Float32Array(MARS_N);
(function genMars(){
  const s=[rnd(0,6),rnd(0,6),rnd(0,6),rnd(0,6)];
  for(let i=0;i<MARS_N;i++){
    const x=MARS_X0+i*MARS_STEP;
    let h=38*Math.sin(x/310+s[0])+22*Math.sin(x/97+s[1])+9*Math.sin(x/37+s[2])+4*Math.sin(x/13+s[3]);
    marsArr[i]=h;
  }
  // Jezero Base plateau: one flat shelf around the ice field
  {const lvl=marsAt(1130);for(let i=0;i<MARS_N;i++){const x=MARS_X0+i*MARS_STEP;if(x>=860&&x<=1400)marsArr[i]=lvl;else{const d=x<860?860-x:x-1400;if(d<80){const t=d/80;marsArr[i]=lerp(lvl,marsArr[i],t*t*(3-2*t))}}}}
  for(const z of ZONES){
    const c=(z.x0+z.x1)/2,lvl=marsAt(c);
    for(let i=0;i<MARS_N;i++){
      const x=MARS_X0+i*MARS_STEP;
      if(x>=z.x0&&x<=z.x1)marsArr[i]=lvl;
      else{const d=x<z.x0?z.x0-x:x-z.x1; if(d<60){const t=d/60;marsArr[i]=lerp(lvl,marsArr[i],t*t*(3-2*t));}}
    }
  }
})();
function marsAt(x){const f=(x-MARS_X0)/MARS_STEP;const i=clamp(Math.floor(f),0,MARS_N-2);const t=clamp(f-i,0,1);return lerp(marsArr[i],marsArr[i+1],t)}
const MARS={id:'mars',g:2.3,dens:a=>0.12*Math.exp(-Math.max(0,a)/900),ground:marsAt};
const zoneAt=x=>ZONES.find(z=>x>=z.x0+4&&x<=z.x1-4);

/* ---------- scenery ---------- */
const stars=Array.from({length:220},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.4+.3,a:Math.random()*.6+.4}));
let rocks=Array.from({length:160},()=>{const x=rnd(-2900,5900);return{x,r:rnd(1.5,6)}}).filter(r=>!zoneAt(r.x));

/* ---------- state ---------- */

const modMax=t=>MODS[t].max||3;
const colN=t=>MODS[t]?Math.min(modMax(t),colony.mods.filter(m=>m.t===t).length):0;   // building level, 0 = not built

function colDeliver(t,mid){

function cloudWrite(name,data){

const AU={ctx:null,on:true,voice:true,last:{}};

function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const a=new C();AU.ctx=a;
    const comp=a.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.connect(a.destination);
    AU.master=a.createGain();AU.master.gain.value=AU.on?.85:0;AU.master.connect(comp);
    const n=a.sampleRate*2;
    const wb=a.createBuffer(1,n,a.sampleRate),w=wb.getChannelData(0);for(let i=0;i<n;i++)w[i]=Math.random()*2-1;AU.white=wb;
    const bb=a.createBuffer(1,n,a.sampleRate),b=bb.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+0.02*(Math.random()*2-1))/1.02;b[i]=l*3.5}AU.brown=bb;
    const chain=(src,...nodes)=>{let x=src;for(const nd of nodes){x.connect(nd);x=nd}x.connect(AU.master);return nodes[nodes.length-1]};
    const loop=buf=>{const s=a.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,Math.random()*1.5);return s};
    const lp=f=>{const x=a.createBiquadFilter();x.type='lowpass';x.frequency.value=f;return x};
    const bp=(f,q)=>{const x=a.createBiquadFilter();x.type='bandpass';x.frequency.value=f;x.Q.value=q;return x};
    const gn=()=>{const g=a.createGain();g.gain.value=0;return g};
    const osc=(type,f)=>{const o=a.createOscillator();o.type=type;o.frequency.value=f;o.start();return o};
    AU.engLP=lp(600);AU.engG=gn();chain(loop(bb),AU.engLP,AU.engG);          // the roar
    AU.rumO=osc('sawtooth',34);AU.rumG=gn();chain(AU.rumO,lp(110),AU.rumG);  // sub-bass felt through the hull
    AU.crkBP=bp(1400,.8);AU.crkG=gn();chain(loop(wb),AU.crkBP,AU.crkG);      // Raptor crackle
    AU.windBP=bp(500,.7);AU.windG=gn();chain(loop(wb),AU.windBP,AU.windG);   // airflow, plasma, Martian wind
    AU.motO=osc('sawtooth',70);AU.motG=gn();chain(AU.motO,lp(900),AU.motG);  // rover motors
    AU.humO=osc('triangle',110);AU.humG=gn();chain(AU.humO,lp(420),AU.humG); // refinery compressors
    AU.digBP=bp(900,1.4);AU.digG=gn();chain(loop(wb),AU.digBP,AU.digG);      // drill
  }catch(e){AU.ctx=null}
}
const auSet=(g,v,tc=.06)=>{if(AU.ctx&&g)g.gain.setTargetAtTime(v,AU.ctx.currentTime,tc)};
const auF=(p,v,tc=.08)=>{if(AU.ctx&&p)p.setTargetAtTime(v,AU.ctx.currentTime,tc)};
function tone(f,dur,{type='sine',vol=.2,at=0,slide=0}={}){
  if(!AU.ctx)return;const a=AU.ctx,t=a.currentTime+at;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,{f=800,q=.7,type='bandpass',vol=.3,at=0,f2=0,brown=false,attack=.005}={}){
  if(!AU.ctx)return;const a=AU.ctx,t=a.currentTime+at;
  const s=a.createBufferSource();s.buffer=brown?AU.brown:AU.white;s.loop=true;
  const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);
}
function sfx(k){
  if(!AU.ctx)return;
  const now=performance.now();if(AU.last[k]&&now-AU.last[k]<70)return;AU.last[k]=now;
  switch(k){
    case 'qin':tone(2525,.25,{vol:.1});break;               // Quindar intro tone
    case 'qout':tone(2475,.25,{vol:.1});break;              // Quindar outro tone
    case 'beep':tone(880,.12,{vol:.12,type:'square'});break;
    case 'go':tone(1320,.4,{vol:.12,type:'square'});break;
    case 'ui':tone(1800,.04,{vol:.05,type:'square'});break;
    case 'rcs':noise(.13,{f:3400,q:.5,type:'highpass',vol:.1});break;
    case 'stage':noise(.7,{f:300,q:.6,vol:.6,brown:true});tone(70,.4,{vol:.4,slide:.5});noise(.25,{f:2500,q:1,vol:.2,at:.02});break;
    case 'boom2':noise(1.6,{f:1100,f2:70,type:'lowpass',q:.5,vol:.6,brown:true});tone(48,.9,{vol:.35,slide:.5});break;
    case 'boom':noise(3,{f:1800,f2:60,type:'lowpass',q:.5,vol:.9,brown:true});tone(55,1.6,{vol:.6,slide:.4});noise(.5,{f:3000,q:.4,vol:.4});break;
    case 'clunk':tone(120,.18,{type:'square',vol:.12,slide:.6});noise(.12,{f:1200,q:3,vol:.14});break;
    case 'thud':tone(70,.45,{vol:.45,slide:.45});noise(.4,{f:300,q:.5,vol:.35,brown:true});break;
    case 'chute':noise(1.2,{f:300,f2:2400,q:1.2,vol:.35});tone(160,.25,{vol:.15,at:1.1,type:'triangle'});break;
    case 'alarm':for(let i=0;i<3;i++){tone(740,.16,{type:'square',vol:.07,at:i*.36});tone(980,.16,{type:'square',vol:.07,at:i*.36+.18})}break;
    case 'chime':[523,659,784].forEach((f,i)=>tone(f,.5,{vol:.08,at:i*.12,type:'triangle'}));break;
    case 'crack':noise(.09,{f:2200,q:.6,vol:.25});break;
    case 'servo':tone(300,.35,{type:'sawtooth',vol:.035,slide:1.6});break;
    case 'bump':tone(90,.12,{vol:.12,slide:.6});break;
  }
}
function say(text,urgent){
  if(!AU.voice||!AU.on||!('speechSynthesis' in window))return;
  try{
    const ss=window.speechSynthesis;
    if(ss.speaking||ss.pending){if(!urgent)return;ss.cancel()}
    const u=new SpeechSynthesisUtterance(text);u.rate=1.07;u.pitch=.9;u.volume=.95;
    const vs=ss.getVoices();const v=vs.find(v=>/en[-_]US/i.test(v.lang)&&/male|david|alex|guy|fred|aaron|daniel/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
    ss.speak(u);
  }catch(e){}
}
let capT=0;
function callout(text,alert){

function auUpdate(){
  if(!AU.ctx)return;
  auSet(AU.master,AU.on?.85:0,.1);
  const live=!S.paused&&body&&!body.dead&&!tr&&['launch','leo','marsLand','marsAscent','reentry','coast','landed'].includes(S.phase);
  let thr=0,air=0,v=0;
  if(live){
    const alt=Math.max(0,body.y-planet.ground(body.x));
    air=S.phase==='leo'||leo?0:clamp(planet===EARTH?EARTH.dens(alt):MARS.dens(alt)/0.12*0.55,0,1);
    v=Math.hypot(body.vx,body.vy);
    if(body.stacked){if(booster&&keys.thrust&&booster.fuel>0&&S.phase==='launch'&&!(S.count>0))thr=booster.dmg?.7:1}
    else if(ship){const n=ship.engines.filter(e=>e.firing).length;thr=n?0.35+0.45*n/ship.engines.length:0}
  }
  // No air, no sound: in vacuum only the muffled structure-borne rumble through the hull survives
  auSet(AU.engG,thr*(0.1+0.8*air));auF(AU.engLP.frequency,130+2600*air*air+300*thr);
  auSet(AU.rumG,thr*.3);
  auSet(AU.crkG,thr*air*(Math.random()<.3?.5:.1),.02);auF(AU.crkBP.frequency,900+Math.random()*1700,.02);
  let wind=live?clamp(air*v/180,0,1)*.35:0;
  if(live&&S.phase==='reentry')wind=Math.max(wind,clamp(body.hull/90,0,1)*.55);
  const m=S.phase==='mining'&&!S.paused?mining:null;
  if(m)wind=Math.max(wind,m.stormOn?.55:.05+clamp((30-m.storm)/30,0,1)*.2);
  if(live&&planet===MARS)wind=Math.max(wind,.035);
  auSet(AU.windG,wind,.2);auF(AU.windBP.frequency,330+v*5+(m?Math.sin(performance.now()/900)*120:0),.3);
  if(tr&&tr.state==='fly'&&tr.t<.8){auSet(AU.rumG,.22);auSet(AU.engG,.04);auF(AU.engLP.frequency,150)}
  if(m&&m.bg){const sp=Math.abs(m.bg.vx),th=(keys.left||keys.right)?1:0;auSet(AU.motG,(.015+.05*th)*(.4+clamp(sp/10,0,1)));auF(AU.motO.frequency,50+sp*13+th*18)}else auSet(AU.motG,0);
  auSet(AU.humG,m&&m.ref&&m.ref.busy?.045:0,.3);
  auSet(AU.digG,m&&m.digNow?.16:0,.05);
}

/* ---------- engines ---------- */
const workingCount=type=>ship.engines.filter(e=>e.type===type&&!e.dmg).length;
function vacMult(){const v=workingCount('VAC');return v>=2?1:v===1?1.15:1.9}
function transferBase(){return 26*vacMult()*RK.fuel}
function homeNeed(){return Math.ceil(22+transferBase()*1.15+10)}

function buildEngChips(){
  const box=$('engs');box.innerHTML='';box.style.gridTemplateColumns=`repeat(${ship.engines.length},1fr)`;
  const counts={SL:0,VAC:0};
  ship.engines.forEach((e,i)=>{
    counts[e.type]++;
    const b=document.createElement('button');
    b.className='eng '+e.type.toLowerCase();b.dataset.i=i;
    b.innerHTML=`<span class="vbar"><i></i></span><span class="t">${e.type==='VAC'?'V':'S'}${counts[e.type]}</span>`;b.title=`${e.type}-${counts[e.type]}`;
    b.addEventListener('click',()=>repair(i));
    box.appendChild(b);
  });
}
function repair(i){
  if(S.phase!=='mining')return;
  const e=ship.engines[i];
  if(!e.dmg){toast('That engine is fine');return}
  if(ship.kits<1){toast('No repair kits — haul hematite to the refinery','var(--warn)');return}
  ship.kits--;e.dmg=false;e.heat=0;toast(`${e.type} engine repaired`,'var(--ok)');

function runEngines(dt,firingAllowed){

    e.firing=false;
    if(want&&!e.dmg&&(mode==='ALL'||mode===e.type)){
      e.firing=true;anyFire=true;
      if(e.type==='SL'){acc+=ENG.SL.thrust;ship.fuel-=(dens<0.1?ENG.SL.fuelVac:ENG.SL.fuelAtm)*dt;e.heat+=(atm?4.6:3.6)*RK.heat*dt}
      else{acc+=atm?ENG.VAC.thrustAtm:ENG.VAC.thrustVac;ship.fuel-=ENG.VAC.fuel*dt;e.heat+=(atm?22:4)*RK.heat*dt}
    }else e.heat-=(atm?11:9)*dt;

function briefing(name){

  let body='',warn='';
  if(name==='launch'){
    body=`<p>Super Heavy lifts you off the pad. Hold <b>Thrust</b>, then tip gently to the right to build sideways speed. Orbit is <b>2,200 m up</b> and <b>280 m/s sideways</b>.</p>
    <ul><li>Watch the <b>booster heat</b>. Push through max-Q too hard and you lose engines.</li>
    <li>Hit <b>Stage</b> when the booster runs dry, then the ship's own engines take over.</li>
    <li><b>VAC</b> engines overheat fast in thick air. Fire <b>SL</b> only until the sky goes dark, then switch.</li>
    <li>Expect turbulence through max-Q. Now and then something breaks. Mission control will call it.</li>
    <li>High up, Starlink trains cross the corridor. Hitting one damages the hull.</li></ul>`;
  }else if(name==='leo'){
    body=`<p>You're in a parking orbit. Mars is only reachable when Earth and Mars line up, so the <b>departure window</b> opens once per orbit. When it opens, point the nose <b>prograde</b> (the direction you're orbiting, marked on the ring) and hold <b>Thrust</b> for the trans-Mars injection burn.</p>
    <ul><li>The burn needs ${TMI_DV} m/s of Δv. Pointing off prograde wastes fuel. VAC engines get it done on the least propellant, so try VAC only.</li>
    <li>Run out of window and you finish the burn on the next pass.</li>
    <li>Between windows the engines throttle right down for manoeuvring. Space is frictionless: thrust to move, turn round and thrust to stop.</li>
    <li>Asteroids: park beside one, match its speed (under 2.5 m/s) and hold <b>Mine</b> (or M). Grey-blue ice rocks give fuel, brown metal rocks give repair kits.</li>
    <li>Debris and Starlink trains hurt. Hull damage stays for the whole trip and makes reentry hotter. A habitat on Mars can patch it.</li></ul>`;
  }else if(name==='toMars'&&ship.tmi){
    body=`<p>The injection burn put you on a Hohmann transfer orbit: half an ellipse around the Sun that meets Mars on the far side. Seven months of coasting, squeezed into a few seconds.</p>`;
  }else if(name==='toMars'||name==='toEarth'){
    const tgt=name==='toMars'?'Mars':'Earth';
    body=`<p>Wait for ${tgt} to drift into the <b>green arc</b>, then tap <b>Burn</b>. Dead centre costs least fuel. Edge of the arc costs up to 60% more.</p>

    <li>Working VAC engines: <b>${vac}</b>. With none left the burn costs almost double.</li></ul>`;
    if(transferBase()>ship.fuel)warn=`You can't afford this burn even if it's perfect. Retry the previous phase or restart.`;
  }else if(name==='marsLand'){
    body=`<p>You're coming in fast over Jezero-style terrain. Kill your sideways speed and set down on the <b>ice field</b> (white, ~1.1 km ahead). Thin air, low gravity, very little drag.</p>
    <ul><li>Touch down <b>upright</b>, under <b>5 m/s</b> down and <b>4 m/s</b> sideways.</li>
    <li>Only flat ground is safe. Boulders tip you over.</li>
    ${colBuilt().length?`<li><b>Jezero Base</b> sits around the ice field. Don't land on the modules.${colN('pad')?' The landing pad in the middle has looser limits.':''}</li>`:''}
    <li>Landing off the ice still works, but the rover has further to drive for water.</li>
    <li><b>Emergency chute</b> (tap <b>Chute</b>, or P): one use. Opens below 85 m/s and lowers you anywhere at about 6 m/s, but the thump wrecks engines: 1 on a landing zone, 2 on boulders.</li></ul>`;
  }else if(name==='mining'){
    body=`<p>Open the cargo ramp and drive the <b>rover</b> out. Dig ice and hematite and bring it back up the ramp: stowing the rover feeds the <b>refinery</b>, which turns ice plus CO₂ into methane and oxygen, and hematite into repair kits.</p>

    <li>There's more ice further out, and Perseverance's sample tubes are somewhere on the delta. Bring them home.</li>

  }else if(name==='marsAscent'){

/* ---------- flight ---------- */
function flight(dt){
  const b=body,P=planet;
  if(b.dead){return}
  const half=b.stacked?60:25;
  // rotation
  if(!b.grounded){
    const r=b.chute?0:(keys.left?-1:0)+(keys.right?1:0);
    b.av+=r*5*dt;b.av*=Math.pow(.015,dt);b.av=clamp(b.av,-1.7,1.7);b.ang+=b.av*dt;
    b.ang=wrap(b.ang*57.2958)/57.2958;

    if(r!==0&&!b.stacked){S.rcsT=(S.rcsT||0)-dt;if(S.rcsT<=0){S.rcsT=.11;sfx('rcs');
      const sd=r>0?-1:1,s=Math.sin(b.ang),c=Math.cos(b.ang),lx=sd*4.8,ly=20,px=b.x+lx*c+ly*s,py=b.y-lx*s+ly*c;
      for(let k=0;k<3;k++)particles.push({x:px,y:py,vx:b.vx+sd*c*rnd(16,28),vy:b.vy-sd*s*rnd(16,28),life:rnd(.2,.38),max:.38,size:rnd(.5,1.2),col:'#eef4ff'})}}
  }
  const dens=P.dens(b.y-P.ground(b.x));
  let acc=0,boostFire=false;
  if(b.stacked){
    for(const e of ship.engines){e.firing=false;e.heat=Math.max(0,e.heat-9*dt)}
    if(keys.thrust&&booster.fuel>0){
      boostFire=true;
      acc=13*RK.bThrust*(1+0.25*(1-booster.fuel/100))*(booster.dmg?0.55:1)*(1-.12*(booster.lost||0));
      booster.fuel=Math.max(0,booster.fuel-5.5*RK.bBurn*dt);
      const v=Math.hypot(b.vx,b.vy);
      booster.heat+=(3.2+dens*v*0.03)*RK.bHeat*dt;
      if(booster.heat>=100&&!booster.dmg){booster.dmg=true;booster.heat=100;toast('Booster engines out — thrust down','var(--bad)');sfx('alarm')}
      if(booster.fuel<=0){toast('Booster dry — STAGE!','var(--warn)');if(!S.f.meco){S.f.meco=1;callout('Booster MECO. Stand by for hot staging.')}}
    }else booster.heat=Math.max(0,booster.heat-6*dt);
  }else{
    const r=runEngines(dt,true);acc=r.acc;
  }
  // forces
  let ax=Math.sin(b.ang)*acc,ay=Math.cos(b.ang)*acc-P.g;
  const v=Math.hypot(b.vx,b.vy);
  let aoa=0;
  if(v>0.5){
    aoa=Math.abs(Math.sin(Math.atan2(b.vx,b.vy)-b.ang));
    const cd=P===MARS?0.0004+0.0016*aoa:0.0003+0.0022*aoa;
    const dr=dens*v*v*cd;
    ax-=dr*b.vx/v;ay-=dr*b.vy/v;
    // heat shield is on the ship's +x side: it only protects when facing the airflow
    const facing=(Math.cos(b.ang)*b.vx-Math.sin(b.ang)*b.vy)>0;
    b.shield=facing?aoa:aoa*0.15;
    if(S.phase==='reentry'){
      b.hull+=(dens*v*v*v*0.000016*(1.6-1.25*b.shield)*RK.hull*(S.tile||1)*(1+(100-(ship.integ??100))/120)-2)*dt;b.hull=Math.max(0,b.hull);
      if(b.hull>=100){explode({t:'Burned up on reentry',d:'The hull overheated. Keep the belly facing the airflow (ship roughly flat) until you are slow.'});return}
    }
  }
  // turbulence scales with dynamic pressure; anomalies add their own pushes
  if(!b.grounded&&v>3){
    const q=dens*v*v;
    S.gT=(S.gT||0)-dt;if(S.gT<=0){S.gT=rnd(.25,.7);S.gTg=rnd(-1,1)}
    S.gust=lerp(S.gust||0,S.gTg||0,Math.min(1,dt*4));
    const turb=q*.00011*(P===MARS?.6:1);
    b.av+=S.gust*turb*dt*3;b.vx+=S.gust*turb*dt*.6;

    if(S.phase==='launch'&&b.stacked){S.f.qmax=Math.max(S.f.qmax||0,q);if(!S.f.maxq&&S.f.qmax>1800&&q<S.f.qmax*.9){S.f.maxq=1;callout('Max Q. The vehicle is through maximum aerodynamic pressure.')}}
  }
  if(boostFire&&b.y<380)S.shake=Math.max(S.shake||0,.55*(1-b.y/380));
  if(boostFire&&b.y<170&&P===EARTH)deluge(4);
  if(S.phase==='launch')stepAscentSats(dt);
  if(S.shear&&S.shear.t>0){S.shear.t-=dt;b.av+=S.shear.dir*2.1*dt;b.vx+=S.shear.dir*3.2*dt;S.shake=Math.max(S.shake||0,.6)}
  if(S.flap&&S.flap.t>0){S.flap.t-=dt;b.av+=S.flap.tq*dt}
  if(S.devil&&S.devil.t>0&&b.y-P.ground(b.x)<700){S.devil.t-=dt;b.vx+=S.devil.dir*2.4*dt;S.shake=Math.max(S.shake||0,.25);if(Math.random()<.3)particles.push({x:b.x+rnd(-20,20),y:P.ground(b.x)+rnd(0,30),vx:S.devil.dir*rnd(10,25),vy:rnd(2,8),life:2,max:2,size:rnd(3,7),col:'#c98a62',smoke:true})}
  if(S.leak&&S.leak.t>0&&!b.stacked){S.leak.t-=dt;ship.fuel=Math.max(0,ship.fuel-.8*dt);if(Math.random()<.35){const s=Math.sin(b.ang),c=Math.cos(b.ang);particles.push({x:b.x-4.6*c,y:b.y+4.6*s,vx:b.vx-c*8,vy:b.vy+s*8,life:.8,max:.8,size:rnd(.8,1.6),col:'#f0f4f8',smoke:dens>.04,grow:2})}}
  if(b.chute&&!b.grounded){
    b.chute.t+=dt;const o=clamp(b.chute.t/1.6,0,1);b.chute.o=o;
    const dn=P.dens(b.y-P.ground(b.x))/0.12;
    const rvx=b.vx-3,rvy=b.vy,rv=Math.hypot(rvx,rvy)||1;
    const a=Math.min(22,0.064*dn*rv*rv*o*o);
    ax-=a*rvx/rv;ay-=a*rvy/rv;
    b.av*=Math.pow(.02,dt);b.ang=lerp(b.ang,0,Math.min(1,dt*1.4*o));
  }
  if(b.grounded){
    if(ay>0.2){b.grounded=false}else{ax=ay=0;b.vx=b.vy=0}
  }
  b.vx+=ax*dt;b.vy+=ay*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(!S.f.lift){
    if(S.phase==='launch'&&b.y>210){S.f.lift=1;callout(`Liftoff! ${RK.short} has cleared the tower.`)}
    if(S.phase==='marsAscent'&&b.y-P.ground(b.x)>80){S.f.lift=1;callout('Liftoff from Mars. Heading for orbit.')}
  }
  if(S.phase==='reentry'&&!S.f.flip&&b.y-P.ground(b.x)<480){S.f.flip=1;callout('Flip manoeuvre. Landing burn startup.')}

  // exhaust
  if(boostFire){for(let i=0;i<3;i++)exhaust(1,'BOOST');
    if(P===EARTH&&b.y<230&&particles.length<520)for(let i=0;i<2;i++)particles.push({x:rnd(-14,14),y:rnd(0,10),vx:rnd(-45,45),vy:rnd(4,26),life:rnd(1.2,2.4),max:2.4,size:rnd(5,10),col:'#f2f5f7',smoke:true});}
  else if(!b.stacked)ship.engines.forEach((e,i)=>{if(e.firing&&Math.random()<.7)exhaust(i,e.type)});

  // Starbase: tower collision and chopstick catch
  if(P===EARTH&&!b.grounded){
    const ext=4.5*Math.abs(Math.cos(b.ang))+half*Math.abs(Math.sin(b.ang));
    const bot=b.y-half*Math.abs(Math.cos(b.ang));
    if(b.x-ext<TOWER_X1&&b.x+ext>TOWER_X0&&bot<TOWER_H){explode({t:'Hit the tower',d:'You clipped the launch tower. Come in over the launch mount, to the right of the tower.'});return}
    if(S.phase==='reentry'&&Math.abs(b.x)<8&&b.y>MOUNT_H+52&&b.y<MOUNT_H+92&&Math.abs(b.vy)<4.5&&Math.abs(b.vx)<3&&Math.abs(b.ang)<0.2){
      S.phase='landed';S.catching=true;b.vx=b.vy=0;b.av=0;b.grounded=true;
      for(const e of ship.engines)e.firing=false;
      toast('Caught by the chopsticks!','var(--ok)');sfx('clunk');callout('Catch! The ship is in the arms. Welcome home.');win(Math.abs(b.x),true);return;
    }
  }
  // ground contact
  const g=P.ground(b.x);
  const bottom=b.y-half*Math.abs(Math.cos(b.ang))-4.5*Math.abs(Math.sin(b.ang));
  if(!b.grounded&&bottom<=g){
    const landing=S.phase==='marsLand'||S.phase==='reentry';
    const onPad=S.phase==='marsLand'&&colN('pad')&&b.x>PAD_X0&&b.x<PAD_X1,lim=onPad?[7.5,5.5,.36]:[5.5,4,.26];
    const soft=b.chute?(Math.abs(b.vy)<=9&&Math.abs(b.vx)<=7):Math.abs(b.vy)<=lim[0]&&Math.abs(b.vx)<=lim[1]&&Math.abs(b.ang)<=lim[2];
    if(!landing){
      if(soft&&Math.abs(b.vy)<3){b.grounded=true;b.y=g+half;b.vx=b.vy=0;b.ang=0;return}
      explode({t:'Back on the ground. In pieces.',d:'You fell back before reaching orbit. Tip over more gradually and keep thrust on.'});return;
    }
    if(!soft){
      const why=Math.abs(b.ang)>0.26?'You were tilted too far at touchdown.':`Touchdown at ${Math.abs(b.vy).toFixed(1)} m/s down, ${Math.abs(b.vx).toFixed(1)} m/s sideways. Limits are 5 and 4.`;
      explode({t:'Hard landing',d:why});return;
    }
    if(S.phase==='marsLand'){
      const z=zoneAt(b.x);
      const hit=modAt(b.x,false,4);
      if(hit){explode({t:`Landed on the ${MODS[hit].name.toLowerCase()}`,d:'You came down on top of a base module. Aim for the ice field in the middle of Jezero Base.'});return}
      if(!z&&!b.chute){explode({t:'Tipped over on a boulder field',d:'Only the flat zones (marked with beacons) are safe. The white ice field is the best one. If it goes wrong, pull the emergency chute.'});return}
      b.y=g+25;b.vx=b.vy=0;b.ang=0;b.grounded=true;ship.marsX=b.x;
      for(const e of ship.engines)e.firing=false;
      if(b.chute){
        b.chute.down=true;
        const n=z?1:2,live=ship.engines.filter(e=>!e.dmg);
        for(let k=0;k<n&&live.length;k++){const e=live.splice(Math.floor(Math.random()*live.length),1)[0];e.dmg=true;ship.stats.lost++}
        burst({x:b.x,y:g+2},40,['#c98a62','#a8673f','#6b3a22']);
        toast(`Chute landing — ${n} engine${n>1?'s':''} wrecked`,'var(--warn)');
      }else toast(z.ice?'The Eagle has… you know':'Landed — off the ice field',z.ice?'var(--ok)':'var(--warn)');
      sfx('thud');callout('Touchdown confirmed. Welcome to Mars.');
      if(colony.lastMid!==ship.mid){colony.lastMid=ship.mid;colony.landings=(colony.landings||0)+1;
        if(colony.landings>1&&(colony.builds||0)<BUILDS.length){colony.builds=(colony.builds||0)+1;colony.bprog=0;S.away=BUILDS[colony.builds-1].name}colSave()}
      const mod=colDeliver(ship.cargo,ship.mid);
      if(mod){S.build={type:mod.t,t:0};const lv=colN(mod.t);setTimeout(()=>callout(lv>1?`Cargo is coming off. Upgrading the ${MODS[mod.t].name.toLowerCase()} to level ${lv}.`:`Cargo is coming off. ${MODS[mod.t].name} going up at Jezero Base.`),3200)}
      S.paused=true;setTimeout(()=>{S.paused=false;checkpoint('mining')},1400);
      S.phase='landed';return;
    }
    if(S.phase==='reentry'){
      if(b.x>260){explode({t:'Splashdown in the Gulf',d:`You came down ${Math.round(b.x)} m from the pad, over water. Use more belly-flop drag earlier.`});return}
      b.y=g+25;b.vx=b.vy=0;b.ang=0;b.grounded=true;
      for(const e of ship.engines)e.firing=false;
      const off=Math.abs(b.x);
      S.phase='landed';
      if(off>70){
        toast('Landed off the pad','var(--warn)');
        fail({t:'Landed in the scrub',d:`A soft landing, but ${Math.round(off)} m from the pad. Mission control wants it on the pad by the tower.`});return;
      }
      sfx('thud');callout('Touchdown at Starbase. Welcome home.');win(off);return;
    }
  }
  // orbit checks
  const alt=b.y-g;
  if(S.phase==='launch'&&!b.stacked&&alt>=2200&&b.vx>=280){orbit('leo','Orbit achieved');return}
  if(S.phase==='marsAscent'&&alt>=1000&&Math.abs(b.vx)>=110){orbit('toEarth','Mars orbit achieved');return}
  if(alt>9000&&S.phase!=='reentry'){fail({t:'Lost to deep space',d:'Too much vertical, not enough sideways speed. Tip over earlier to build horizontal velocity.'})}
}
function orbit(next,msg){
  toast(msg,'var(--ok)');S.phase='coast';
  callout(next==='leo'?'SECO. Nominal orbit. Welcome to low Earth orbit.':'Engine cutoff. We are in Mars orbit. Next stop, home.');
  for(const e of ship.engines)e.firing=false;
  setTimeout(()=>checkpoint(next),1600);
}

function deployChute(){
  if(S.phase!=='marsLand'||!body||body.dead||body.grounded||body.chute)return;
  if(!ship.chute){toast('Parachute already used','var(--warn)');return}
  const v=Math.hypot(body.vx,body.vy),alt=body.y-marsAt(body.x)-25;
  if(alt<35){toast('Too low for the chute','var(--warn)');return}
  ship.chute=0;$('bAct').disabled=true;
  if(v>85){toast(`Chute shredded at ${Math.round(v)} m/s`,'var(--bad)');return}
  body.chute={t:0,o:0};toast('Emergency chute out','var(--warn)');sfx('chute');
}
function stage(){
  if(S.phase!=='launch'||!body.stacked||body.dead)return;
  const b=body,s=Math.sin(b.ang),c=Math.cos(b.ang);
  const off=35;
  debris={x:b.x-25*s*.99-35*s*0+(-25)*s,y:b.y+(-25)*c,vx:b.vx,vy:b.vy,ang:b.ang,av:0,t:0,dry:booster.fuel<=0};
  debris.x=b.x+(-25)*s;debris.y=b.y+(-25)*c;
  b.x+=off*s;b.y+=off*c;b.stacked=false;
  $('bAct').disabled=true;$('xtra').hidden=$('xtra2').hidden=true;
  toast(booster.fuel>5?'Early staging — fuel wasted':'Hot staging!','var(--hot)');
  sfx('stage');S.shake=.8;callout('Stage separation confirmed. Ship engines lit. Booster starting boostback.');
}

function stepDebris(dt){
  const d=debris;if(!d)return;
  d.t+=dt;
  const dens=EARTH.dens(d.y),v=Math.hypot(d.vx,d.vy)||1;
  let ax=0,ay=-EARTH.g;
  if(d.t>1.5&&d.t<5){ // boostback
    const target=Math.PI/2*-1;d.ang+=clamp(wrap((target-d.ang)*57.3)/57.3,-1,1)*dt*1.5;
    ax+=Math.sin(d.ang)*9;ay+=Math.cos(d.ang)*9;d.fire=true;
  }else d.fire=false;
  const dr=dens*v*v*0.0015;ax-=dr*d.vx/v;ay-=dr*d.vy/v;
  d.vx+=ax*dt;d.vy+=ay*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;
  if(d.y<0||d.t>14)debris=null;
}

/* ---------- transfer ---------- */
function stepTransfer(dt){
  const t=tr;
  const wE=55,wM=28;
  t.eA+=wE*dt;t.mA+=wM*dt;
  if(t.state==='wait'){
    if(thrEdge&&S.blackout>0){toast('No signal — wait for telemetry','var(--warn)');return}
    if(thrEdge){
      const phase=t.toM?wrap(t.mA-t.eA):wrap(t.eA-t.mA);
      const dev=wrap(phase-t.ideal);
      if(Math.abs(dev)>20){toast('No intercept — wait for the arc','var(--warn)');return}
      const cost=transferBase()*(1+0.6*Math.abs(dev)/20);
      if(cost>ship.fuel){toast('Not enough fuel','var(--bad)');fail({t:'Stranded in orbit',d:`That burn needed ${Math.round(cost)}% fuel and you had ${Math.round(ship.fuel)}%. Mine more fuel or keep your VAC engines alive.`});return}
      ship.fuel-=cost;
      t.cost=cost;t.dev=dev;t.state='fly';t.t=0;t.th0=t.toM?t.eA:t.mA;
      t.dur=t.toM?136/wM:255/wE;
      toast(Math.abs(dev)<5?'Perfect burn':`Burn complete — ${Math.round(cost)}% fuel`,Math.abs(dev)<5?'var(--ok)':'var(--fg)');
      ship.engines.forEach(e=>{if(!e.dmg&&e.type==='VAC')e.firing=true});
      callout(t.toM?'Trans-Mars injection burn complete. Next stop, Jezero.':'Trans-Earth injection complete. We are coming home.');
    }
  }else if(t.state==='fly'){
    t.t+=dt;
    if(t.t>0.8)ship.engines.forEach(e=>e.firing=false);
    if(t.t>=t.dur){t.state='done';S.phase='coast';toast(t.toM?'Arriving at Mars':'Arriving at Earth','var(--ok)');setTimeout(()=>checkpoint(t.toM?'marsLand':'reentry'),1300)}
  }
}

function launchFromMars(){
  if(S.phase!=='mining')return;
  if(!roverHome()){toast('Stow the rover or shelter it first','var(--warn)');return}
  if(mining.stormOn){toast("Can't launch into a dust storm",'var(--warn)');return}
  colSave();
  callout(mining.rover==='shelter'?'Rover stays at Jezero Base. Mars ascent, you are go.':'Rover is stowed. Mars ascent, you are go.');
  checkpoint('marsAscent');
}

/* ---------- win / menu ---------- */
function win(off,caught){
  S.phase='won';
  if(!caught)toast(off<14?'Down on the launch mount!':'Home at Starbase','var(--ok)');
  const time=S.clock;
  const mm=Math.floor(time/60),ss=Math.floor(time%60);
  let stars=1+(caught?2:off<20?1:0)+(ship.stats.lost===0?1:0)+(ship.fuel>8?1:0)+(time<420?1:0)+(colN('green')?1:0);
  const del=colony.mods.find(m=>m.mid===ship.mid);clearGame();if(ship.samples&&!ship.samplesBanked){ship.samplesBanked=1;colony.samples=(colony.samples||0)+ship.samples;colSave()}
  stars=clamp(stars,1,5);
  setTimeout(()=>{
    show(`<div class="eyebrow">Mission complete</div><h2>${caught?'Caught at Starbase':'Mars and back'}</h2>
    <p>${['A bit scrappy, but everyone walked off.','Solid flying, commander.','Properly good. The tower crew applauded.','That was textbook.','Flawless. They will name a crater after you.'][stars-1]}</p>
    <div class="stats">
      <div class="stat"><span>Rating</span><b style="color:var(--warn)">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</b></div>
      <div class="stat"><span>Mission time</span><b>${mm}:${String(ss).padStart(2,'0')}</b></div>
      <div class="stat"><span>Return</span><b>${caught?'Tower catch':Math.round(off)+' m off centre'}</b></div>
      <div class="stat"><span>Fuel left</span><b>${Math.round(ship.fuel)}%</b></div>
      <div class="stat"><span>Rocket</span><b style="font-size:15px">${RK.short}</b></div>
      <div class="stat"><span>Chute</span><b>${ship.chute?'Unused':'Deployed'}</b></div>
      <div class="stat"><span>Engines burned out</span><b>${ship.stats.lost}</b></div>
      <div class="stat"><span>Fuel refined on Mars</span><b>${Math.round(ship.stats.mined)}%</b></div>
      <div class="stat"><span>Delivered to Jezero</span><b style="font-size:15px">${del?MODS[del.t].short:'—'}</b></div>
      <div class="stat"><span>Sample tubes returned</span><b>${ship.samples||0}</b></div>
      <div class="stat"><span>Hull integrity</span><b>${Math.round(ship.integ??100)}%</b></div>
      <div class="stat"><span>Jezero Base</span><b style="font-size:15px">${colBuilt().length} building${colBuilt().length===1?'':'s'}</b></div>
    </div>
    <div class="btns"><button class="btn" id="again">Fly again</button></div>`);
    $('again').onclick=()=>{hide();menu()};
  },1600);
}

function drawPreview(c,r){
  const d=Math.min(2,devicePixelRatio||1),cw=c.clientWidth||70,ch=c.clientHeight||120;
  c.width=Math.round(cw*d);c.height=Math.round(ch*d);
  const g=c.getContext('2d'),oc=ctx,oR=RK.id,oS=ship,oL={...LIGHT};
  ctx=g;setRocket(r.id);ship=null;LIGHT.lx=.6;LIGHT.shade=.32;
  const sc=(ch-8)/124;
  g.setTransform(d*sc,0,0,-d*sc,d*cw/2,d*(ch-4-62*sc));
  g.save();g.translate(0,35);drawShip(false,false);g.restore();
  g.save();g.translate(0,-25);drawBooster(false,false,1);g.restore();
  ctx=oc;setRocket(oR);ship=oS;Object.assign(LIGHT,oL);
}

  if(ps)for(const p of ps){const d=Math.abs(x-p.x);if(d<p.r)h=Math.max(h,marsAt(p.x)+p.h*(.5+.5*Math.cos(Math.PI*d/p.r)))}

  for(let i=0;i<70;i++){const a=Math.random()*6.283,sp=rnd(4,44)*s;particles.push({x:x+rnd(-4,4),y:y+rnd(-4,4),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.6,1.7),max:1.7,size:rnd(3,9)*s,col:['#fff3c4','#ffd27a','#ff9a3a','#ff5a1a'][i%4],add:true,smoke:true,grow:(2+12*atm)*s})}
  if(atm>.05)for(let i=0;i<46;i++){const a=Math.random()*6.283,sp=rnd(2,18)*s;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp+4,life:rnd(4,9),max:9,size:rnd(5,12)*s,col:planet===MARS?'#5a3826':'#38383a',smoke:true,grow:rnd(4,9)*s*atm})}

function stepBooms(dt){for(const b of booms){const was=b.t;b.t+=dt;if(was<0&&b.t>=0){sfx('boom2');S.shake=Math.max(S.shake||0,.9);S.flash=Math.max(S.flash||0,.4)}}booms=booms.filter(b=>b.t<2.4)}

/* ---------- low Earth orbit: debris field before the Mars departure burn ---------- */
let leo=null;

function startLeo(){
  const R=seeded((Math.random()*1e6|0)+1);

  for(let i=0;i<13;i++){const r=8+R()*28,type=R()<.55?'ice':'metal';ast.push({x:380+i*195+R()*110,y:(R()-.5)*560,vx:(R()-.5)*1.4,vy:(R()-.5)*1.4,a:R()*6.28,va:(R()-.5)*.12,r,type,pts:polyRock(R,r),craters:Array.from({length:4+(R()*5|0)},()=>[(R()-.5)*r*1.1,(R()-.5)*r*1.1,1+R()*r*.16]),left:Math.round(r*r*.07),max:Math.round(r*r*.07)})}
  const deb=[];for(let i=0;i<36;i++)deb.push({x:200+R()*2800,y:(R()-.5)*700,vx:(R()-.5)*14,vy:(R()-.5)*8,a:R()*6.28,va:(R()-.5)*3,r:.7+R()*1.8,kind:R()<.5?'panel':'frag'});
  const sats=[];
  for(let t=0;t<3;t++){const y=(t-1)*240+(R()-.5)*60,dir=t%2?1:-1,sp=(18+R()*10)*dir,x0=R()*3200;for(let k=0;k<7;k++)sats.push({x:x0-k*34*dir,y:y+(R()-.5)*6,vx:sp,vy:0,a:0,va:0,r:4.5,kind:'starlink'})}
  sats.push({x:1500,y:140,vx:-2.5,vy:.5,a:0,va:.16,r:9,kind:'old'});
  body={x:0,y:0,vx:9,vy:0,ang:Math.PI/2,av:0,stacked:false,grounded:false,hull:0};
  leo={ast,deb,sats,mine:false,kitP:0,scroll:0,near:null,act:{k:'none',label:'Approach an asteroid'},win:{open:false,t:32},dv:0,aim:[0,0]};

function stepLeo(dt){

  if(r!==0){S.rcsT=(S.rcsT||0)-dt;if(S.rcsT<=0){S.rcsT=.11;sfx('rcs');const sd=r>0?-1:1,s=Math.sin(b.ang),c=Math.cos(b.ang),lx=sd*4.8,ly=20,px=b.x+lx*c+ly*s,py=b.y-lx*s+ly*c;

    toast(`Trans-Mars injection complete · ${pct}% on prograde`,'var(--ok)');callout('TMI complete. You are on a transfer orbit to Mars.');setTimeout(()=>checkpoint('toMars'),1700);return}
  if(Math.abs(b.y)>470)b.vy-=Math.sign(b.y)*1.6*dt;

      const n=S.sats.reduce((a,o)=>!a||Math.hypot(o.x-b.x,o.y-b.y)<Math.hypot(a.x-b.x,a.y-b.y)?o:a,null),[sx,sy]=toS(n.x,n.y);
      if(vis(sx,sy,0))tacLabel(sx,sy,6+4*z,['STARLINK TRAIN','ACTIVE · KEEP CLEAR'],TC.bad);else tacEdge(sx,sy,'STARLINK',TC.bad);
      threat=threat||tacThreat(S.sats.map(o=>({o,kind:'sat'})),b,b.stacked?40:22,{sat:.5});
    }
  }
  /* ----- collision warning ----- */
  if(threat){const [sx,sy]=toS(threat.o.x,threat.o.y),bl=threat.t<2;
    ctx.strokeStyle=TC.bad;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(sx,sy);ctx.stroke();ctx.setLineDash([]);
    tacBracket(sx,sy,Math.max(10,(threat.o.r||2)*z+8),TC.bad,null,now,bl);
    const what={ast:'ASTEROID',deb:'DEBRIS',sat:'SATELLITE'}[threat.kind];
    tacChip(bx,Math.max(80,by-sr-30),W<600?`⚠ ${what} ${threat.t.toFixed(1)}s`:`⚠ COLLISION ${threat.t.toFixed(1)}s · ${what} · ${Math.round(threat.rel)} m/s`,TC.bad,bl,now);
    tacBeepT-=1/60;if(tacBeepT<=0){tacBeepT=threat.t<2?.35:.8;sfx('beep')}
  }
}
function setTac(on){TAC=on;try{localStorage.setItem('mrt.tac',on?'1':'0')}catch(e){}const b=$('tac');if(b){b.textContent=on?'HUD':'HUD OFF';b.classList.toggle('off',!on)}}
setTac(TAC);

/* ---------- HUD ---------- */
const fmt=n=>Math.round(n).toLocaleString('en-GB');
function hud(){
  if(!ship)return;
  const m=Math.floor(S.clock/60),s=Math.floor(S.clock%60);
  $('clock').textContent=`T+${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $('vF').textContent=Math.round(ship.fuel)+'%';$('bF').style.width=ship.fuel+'%';
  const it=ship.integ??100;$('kits').textContent=[ship.kits?`REPAIR KITS ${ship.kits}`:'',it<99.5?`HULL ${Math.round(it)}%`:''].filter(Boolean).join(' · ');
  const chips=$('engs').children;
  ship.engines.forEach((e,i)=>{const c=chips[i];if(!c)return;
    c.classList.toggle('firing',!!e.firing);c.classList.toggle('hot',!e.dmg&&e.heat>75);c.classList.toggle('dmg',e.dmg);
    c.classList.toggle('fixable',S.phase==='mining'&&e.dmg&&ship.kits>0);
    c.querySelector('i').style.height=(e.dmg?100:e.heat)+'%';
    c.querySelector('.t').textContent=(e.dmg?'✕':c.dataset.lbl);
  });
  const obj=$('obj');let o='';$('tA').textContent='';$('tH').textContent='';
  if(S.phase==='toMars'||S.phase==='toEarth'||(tr&&S.phase==='coast')){
    $('vA').textContent='—';$('vH').textContent='—';$('vV').textContent='—';
    if(tr&&tr.state==='wait'){
      const phase=tr.toM?wrap(tr.mA-tr.eA):wrap(tr.eA-tr.mA);const dev=wrap(phase-tr.ideal);
      o=`Tap BURN when ${tr.toM?'Mars':'Earth'} is in the green arc · ${Math.abs(dev)<=20?'IN WINDOW · cost ≈ '+Math.round(transferBase()*(1+0.6*Math.abs(dev)/20))+'%':'window in '+Math.max(0,Math.round((Math.abs(dev)-20)/27))+'s'}`;
    }else o='Coasting…';
  }else if(leo&&(S.phase==='leo'||S.phase==='coast')){
    const L=leo,b=body,d=Math.hypot(LEO_GATE.x-b.x,LEO_GATE.y-b.y);
    const Wn=L.win;$('kA').textContent='TMI WINDOW';$('vA').textContent=(Wn.open?'OPEN ':'in ')+Math.ceil(Wn.t)+'s';$('rA').classList.toggle('done',Wn.open);
    $('x2V').textContent=`${Math.max(0,Math.round(L.dv))}/${TMI_DV} m/s`;$('x2B').style.width=clamp(L.dv/TMI_DV*100,0,100)+'%';
    $('kH').textContent='SPEED';$('vH').textContent=Math.hypot(b.vx,b.vy).toFixed(1)+' m/s';
    $('kV').textContent='NEAREST ROCK';$('vV').textContent=L.near?fmt(Math.max(0,L.near.d))+' m':'—';$('tH').textContent=L.near?`rel ${L.near.rv.toFixed(1)} m/s`:'';
    $('xV').textContent=Math.round(ship.integ??100)+'%';$('xB').style.width=(ship.integ??100)+'%';
    $('bAct').disabled=L.act.k!=='mine';
    o=Wn.open?(Math.sin(b.ang)>.97?'Window open: hold THRUST for the injection burn':'Window open: point the nose at PROGRADE ▸ and burn'):L.mining?'Mining…':L.act.k==='mine'?'Hold MINE to harvest this asteroid':L.act.label==='Match speed to mine'?'Match its speed (under 2.5 m/s rel) to mine':`Window in ${Math.ceil(Wn.t)}s · mine asteroids while you wait`;
  }else if(body&&S.phase!=='mining'){
    $('kA').textContent='ALT';$('kH').textContent='H-SPD';$('kV').textContent='V-SPD';
    const alt=body.y-planet.ground(body.x)-(body.stacked?60:25);
    $('vA').textContent=fmt(Math.max(0,alt))+' m';$('vH').textContent=fmt(body.vx)+' m/s';$('vV').textContent=fmt(body.vy)+' m/s';
    if(S.blackout>0){const z='▒▒▒▒'.slice(0,2+(Math.random()*3|0));$('vA').textContent=z;if(Math.random()<.5)$('vV').textContent=z}
    if(S.phase==='launch'){
      $('tA').textContent='target 2,200 m';$('tH').textContent='target 280 m/s';
      $('rA').classList.toggle('done',alt>=2200);$('rH').classList.toggle('done',body.vx>=280);
      o=S.count>0?'Terminal count · hold THRUST at ignition':body.stacked?(booster.fuel>0?'Hold THRUST · tip right slowly · watch booster heat':'Booster empty — hit STAGE'):(planet.dens(body.y)>0.25?'Thick air: run SL engines · VAC overheats here':'Thin air: switch to VAC for efficient speed');
      $('xV').textContent=Math.round(booster.heat)+'°';$('xB').style.width=booster.heat+'%';
      $('x2V').textContent=Math.round(booster.fuel)+'%';$('x2B').style.width=booster.fuel+'%';
    }else if(S.phase==='marsAscent'){
      $('tA').textContent='target 1,000 m';$('tH').textContent='target 110 m/s';
      $('rA').classList.toggle('done',alt>=1000);$('rH').classList.toggle('done',Math.abs(body.vx)>=110);
      o='Climb and build sideways speed to reach Mars orbit';
    }else if(S.phase==='marsLand'){
      o=body.chute?(S.warp>1?'Under chute · ×6 time warp until 120 m':'Under chute · drifting with the wind · brace'):'Land upright on the ice field · under 5 m/s';
    }else if(S.phase==='reentry'){
      const sh=body.shield||0;
      o=alt>450?`Belly-flop · heat shield ${sh>0.85?'GOOD':sh>0.5?'PARTIAL':'EXPOSED'} · keep it side-on to the arrow`:(Math.abs(body.x)<60?'Hover into the chopsticks, or set down on the mount':'Flip upright · burn SL engines · head for the tower');
      $('xV').textContent=Math.round(body.hull)+'%';$('xB').style.width=clamp(body.hull,0,100)+'%';
    }
  }
  if(S.phase==='mining'&&mining){
    const mn=mining,b=mn.bg,r=mn.ref,out=mn.rover==='out'&&!!b,c=out?b.cargo:{ice:0,iron:0,sample:0},load=c.ice+c.iron;
    const st=$('storm');st.textContent=mn.stormOn?`Dust storm · ${Math.ceil(mn.stormLeft)}s left`:`Next dust storm ${Math.ceil(mn.storm)}s`;st.classList.toggle('near',mn.stormOn||mn.storm<25);
    const where=mn.rampDir?'RAMP MOVING':mn.rover==='stowed'?'ROVER STOWED':mn.rover==='shelter'?`ROVER IN ${MODS[mn.shelter].short.toUpperCase()}`:`ROVER ${load>.05?Math.round(load)+'/'+BG.cap+' t '+(c.ice>=c.iron?'ICE':'HEMATITE'):'EMPTY'}${c.sample?' · '+c.sample+' TUBE':''} · ${Math.round(Math.abs(b.vx)*3.6)} km/h`;
    $('cargo').textContent=`${where} · BAT ${Math.round(mn.bat)}%${mn.hp<99.5?' · AIR '+Math.round(mn.hp)+'%':''}`;
    const need=Math.min(100,homeNeed());
    $('mfV').textContent=`${Math.round(ship.fuel)}% · need ${need}%`;$('mfB').style.width=ship.fuel+'%';$('mfM').style.left=need+'%';
    $('mfV').style.color=ship.fuel>=need?'var(--ok)':'var(--warn)';
    $('rfL').textContent=r.ice>0?'SABATIER RUNNING':r.iron>0?'PRINTING PARTS':colN('rig')?'DRILL RIG PUMPING':'REFINERY IDLE';
    $('rfV').textContent=r.ice>0?`${Math.round(r.ice)} t`:r.iron>0?`kit ${Math.round(r.kitProg*100)}%`:(ship.kits?`${ship.kits} kit${ship.kits>1?'s':''}`:'');
    $('rfB').style.width=(r.ice>0?Math.min(100,r.ice/BG.cap*100):r.kitProg*100)+'%';
    const a=mn.act,bd=$('bDo');if(bd.textContent!==a.label)bd.textContent=a.label;bd.disabled=a.k==='none';if(bd.disabled)bd.classList.remove('on');
    const home=roverHome(),bl=$('bLaunch');bl.disabled=!home||mn.stormOn;bl.textContent=home&&mn.stormOn?'Storm':home?'Launch':'Rover out';
    document.querySelectorAll('#mine .arrow').forEach(x=>x.disabled=!out);
    const px=out?b.x:body.x,dirTxt=x=>x>px?'▸':'◂',dist=x=>Math.round(Math.abs(x-px));
    const nearest=type=>{let best=null,bdd=1e9;for(const d of mn.deps)if(d.type===type&&d.left>.05){const dd=Math.abs(d.x-px);if(dd<bdd){bdd=dd;best=d}}return best};
    if(mn.stormOn)o=out?'Get to shelter! The ship ramp or a base building':'Sheltering · waiting out the storm';
    else if(mn.rover==='stowed')o=ship.fuel<need?'Deploy the rover to fetch ice':'Fuel is good. Launch, or explore for samples';
    else if(mn.rover==='shelter')o='Sheltered and charging. Drive out when ready';
    else if(load>=BG.cap-.01)o=`Rover full · back to the ship ${dirTxt(body.x)} ${dist(body.x)} m`;
    else if(ship.fuel<need){const ice=nearest('ice');o=ice?`Fuel short: ice ${dirTxt(ice.x)} ${dist(ice.x)} m`:'No ice left nearby'}
    else if(ship.engines.some(e=>e.dmg))o=ship.kits?'Tap a broken engine to repair it':'Engines damaged: hematite makes repair kits';
    else{const sm=nearest('sample');o=sm?`Sample tube ${dirTxt(sm.x)} ${dist(sm.x)} m · or stow and launch`:'Stow the rover and launch'}
    if(out&&mn.bat<15&&!mn.stormOn)o='Battery low! Head back to charge';
    if(mn.slow>0)o='Rover motor fault · reduced power';
  }
  obj.textContent=o;
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  thrEdge=keys.thrust&&!prevThr;prevThr=keys.thrust;
  if(keys.zin)zoomBy(1+dt*1.8);if(keys.zout)zoomBy(1/(1+dt*1.8));
  if(planet===EARTH&&body){
    const qdT=(S.phase==='launch'||S.phase==='menu')&&body.grounded?1:0;S.qd=lerp(S.qd??1,qdT,Math.min(1,dt*3));
    S.carY=lerp(S.carY??125,S.catching?body.y+12:125,Math.min(1,dt*2));
    S.arms=lerp(S.arms||0,S.catching?1:0,Math.min(1,dt*(S.catching?2.5:4)));
  }
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on')}
  if(!S.paused){
    if(S.phase==='launch'&&S.count>0)stepCountdown(dt);
    else if(['launch','marsLand','marsAscent','reentry'].includes(S.phase)){const warp=S.phase==='marsLand'&&body&&body.chute&&!body.grounded&&body.y-marsAt(body.x)>120?6:1;S.warp=warp;for(let i=0;i<warp&&['launch','marsLand','marsAscent','reentry'].includes(S.phase);i++){S.clock+=dt;flight(dt)}}
    else if(S.phase==='toMars'||S.phase==='toEarth'){S.clock+=dt;stepTransfer(dt)}
    else if(S.phase==='coast'&&tr)stepTransfer(dt);
    else if(S.phase==='mining'){S.clock+=dt;stepSurface(dt)}
    else if(S.phase==='leo'){S.clock+=dt;stepLeo(dt)}
    if(colonists&&planet===MARS)stepColonists(dt);
    if(['launch','toMars','toEarth','marsLand','mining','marsAscent','reentry'].includes(S.phase)&&!(S.count>0))stepAnomaly(dt);
    if(S.blackout>0)S.blackout-=dt;
    if(body&&S.phase==='coast'&&!tr){ // drift after orbit
      body.x+=body.vx*dt;body.y+=Math.max(0,body.vy)*dt*0.3;
      for(const e of ship.engines)e.heat=Math.max(0,e.heat-9*dt);
    }
    stepDebris(dt);
  }
  stepBooms(dt);if(S.flash>0)S.flash-=dt*2.2;if(S.deluge>0)S.deluge-=dt;
  if(S.phase==='dead'&&body&&!body.dead&&!tr){} // frozen
  stepParticles(dt);
  if(tr&&(S.phase==='toMars'||S.phase==='toEarth'||S.phase==='coast'))drawTransfer();
  else{
    // camera
    if(S.phase==='mining'&&mining){
      const m=mining,out=m.rover==='out'&&m.bg,tx=out?m.bg.x+m.bg.vx*.9:m.rover==='shelter'?modX(m.shelter):body.x+6,ty=out?m.bg.y+7:marsAt(tx)+(m.rover==='shelter'?9:16);
      const zt=sScale()*(out?5.2:3.3)*userZoom;
      cam.z=cam.z?lerp(cam.z,zt,Math.min(1,dt*2.5)):zt;
      cam.lx=lerp(cam.lx??tx,tx,Math.min(1,dt*2.4));cam.ly=lerp(cam.ly??ty,ty,Math.min(1,dt*2.4));cam.x=cam.lx;cam.y=cam.ly;
    }else if(leo&&(S.phase==='leo'||S.phase==='coast')&&body){
      const zt=Math.min(sScale()*.72*1.6*userZoom,leoZoomNeed());cam.z=cam.z?lerp(cam.z,zt,Math.min(1,dt*(zt<cam.z?3:1.2))):zt;cam.x=body.x;cam.y=body.y;cam.lx=cam.ly=undefined;
    }else if(body){
      cam.lx=cam.ly=undefined;
      const g=planet.ground(body.x);const alt=Math.max(0,body.y-g);
      const zt=sScale()*clamp(380/(alt*0.5+300),0.16,1.25)*userZoom;
      cam.z=cam.z?lerp(cam.z,zt,Math.min(1,dt*2.5)):zt;
      const gl=planet===EARTH?0:g;cam.x=body.x;cam.y=Math.max(body.y,gl+(H*0.58-130)/cam.z);
    }
    drawWorld(cam.z||1);
  }
  if(capT>0){capT-=dt;if(capT<=0)$('capcom').classList.remove('on')}
  const sh=reduceMotion||S.paused?0:(S.shake||0);S.shake=(S.shake||0)*Math.pow(.04,dt);
  cv.style.transform=sh>.03?`translate(${((Math.random()-.5)*sh*7).toFixed(1)}px,${((Math.random()-.5)*sh*7).toFixed(1)}px) scale(1.02)`:'';
  auUpdate();
  hud();
  requestAnimationFrame(frame);
}

// label cache for chips
const _build=buildEngChips;
buildEngChips=function(){_build();[...$('engs').children].forEach(c=>c.dataset.lbl=c.querySelector('.t').textContent)};

/* ---------- boot ---------- */
window.claude?.hot?.snapshot?.(()=>({cp:S.cp,cpPhase:S.cpPhase,rk:RK.id,clock:S.clock}));
function boot(d){
  if(d&&d.cp&&d.cpPhase){setRocket(d.rk||d.cp.rk||'starship');S.clock=d.clock||0;S.cp=d.cp;S.cpPhase=d.cpPhase;ship=clone(d.cp);buildEngChips();menuBg();briefing(d.cpPhase)}
  else menu();
  requestAnimationFrame(t=>{last=t;frame(t)});
}
function menuBg(){body={x:0,y:82,vx:0,vy:0,ang:0,av:0,stacked:true,grounded:true};planet=EARTH}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
