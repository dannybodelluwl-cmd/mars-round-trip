<style>
/* Layout: full-bleed flight canvas, telemetry overlay top-left, thumb controls along the bottom edge */
:root{

  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--mono);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}

.vbar{width:8px;height:58px;background:#1a222c;border-radius:3px;overflow:hidden;position:relative}

/* surface ops */

#capcom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:rgba(8,12,18,.82);border:1px solid rgba(105,211,255,.35);border-left:3px solid var(--cool);border-radius:6px;padding:7px 10px;font-size:11.5px;line-height:1.45;opacity:0;transition:opacity .3s;display:grid;gap:2px}

#crewB{display:none}body.surface #crewB{display:inline-block}@media (max-width:430px){#rst .lbl{display:none}}

.foci{display:flex;gap:6px;flex-wrap:wrap}.foci .tg[aria-pressed="true"]{background:rgba(240,240,250,.14)}
.more summary{cursor:pointer;font-family:var(--din);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(240,240,250,.6);list-style:none;padding:4px 0}.more summary::-webkit-details-marker{display:none}.more summary:after{content:' ＋'}.more[open] summary:after{content:' －'}.more ul{margin-top:8px}
#banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(560px,86%);text-align:center;display:grid;gap:4px;pointer-events:none;opacity:0;transition:opacity .35s,top .5s,transform .5s;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#banner.on{opacity:1}#banner span{font-family:var(--din);font-weight:600;font-size:12px;letter-spacing:.3em;color:rgba(240,240,250,.85)}

#banner #bnS{letter-spacing:.06em;font-size:14px;font-weight:500;text-transform:none;color:#f0f0fa}

@media (max-width:560px){#banner{top:calc(var(--sideTop,74px) + 200px);width:92%}#banner.small{top:calc(var(--sideTop,74px) + 196px);transform:translateX(-50%) scale(.55)}}
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));max-width:min(460px,90%);background:rgba(240,240,250,.95);color:#06080c;font-family:var(--din);font-weight:600;font-size:14px;letter-spacing:.02em;padding:9px 16px;border-radius:24px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#tip.on{opacity:1;transform:translateX(-50%) translateY(-6px)}#tip:before{content:'TIP';font-size:10px;letter-spacing:.22em;margin-right:8px;color:#ff6a1f}

.card{width:min(560px,100%);background:transparent;border:0;border-radius:0;padding:8px 0 24px;gap:18px;font-family:var(--din);color:var(--sw)}

.rkinfo .tag{color:rgba(240,240,250,.6);letter-spacing:.2em}
.sbars{color:rgba(240,240,250,.55);font-family:var(--din);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}
.pips i{background:rgba(240,240,250,.12);border-radius:0;height:4px}.pips i.f{background:var(--sw)}
.slot{font-family:var(--din);font-weight:700;letter-spacing:.14em;font-size:22px}
.slot.sl{color:var(--sw);border-color:rgba(240,240,250,.3)}.slot.vac{color:#9fd4ff;border-color:rgba(159,212,255,.35)}
.slot small{font-family:var(--din);letter-spacing:.16em;text-transform:uppercase;color:rgba(240,240,250,.5)}
.cg .n{color:rgba(240,240,250,.6);letter-spacing:.14em;text-transform:uppercase;font-size:9.5px}.cg.on .n{color:#fff}
.base{font-family:var(--din);color:rgba(240,240,250,.72)}
.base .mini,.tg{border-radius:32px;font-family:var(--din);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;border-color:rgba(240,240,250,.3);color:rgba(240,240,250,.8);padding:7px 14px}
.tg[aria-pressed="true"]{border-color:var(--sw);color:#fff}
.stat span{font-family:var(--din);letter-spacing:.16em;color:rgba(240,240,250,.5)}.stat b{font-family:var(--din);font-weight:600}

.brand i{font-style:normal;font-weight:500;color:rgba(240,240,250,.4);letter-spacing:.2em}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px;font-size:12px}.roster div{display:flex;gap:6px;align-items:baseline}.roster span{color:rgba(240,240,250,.5);font-size:11px}
.demo{margin:0;display:grid;gap:6px}.demo img{width:100%;aspect-ratio:8/5;object-fit:cover;border:1px solid rgba(240,240,250,.18);display:block}.demo figcaption{font-family:var(--din);font-size:10.5px;letter-spacing:.24em;color:rgba(240,240,250,.55)}

      <div><div class="lab"><span id="rfL">REFINERY IDLE</span><span id="rfV"></span></div><div class="bar" style="height:9px"><i id="rfB" style="background:linear-gradient(90deg,#3fd07a,#a6f0c0)"></i></div></div>
    </div>

  </div>
  <div class="ov" id="ov" hidden><div class="card" id="card"></div></div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
if(/netlify\.app$/i.test(location.hostname))document.body.classList.add('badge');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',resize);resize();try{new ResizeObserver(()=>{if(cv.clientWidth!==W||cv.clientHeight!==H)resize()}).observe(cv)}catch(e){}

const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const clone=o=>JSON.parse(JSON.stringify(o));
const wrap=d=>((d+540)%360)-180;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- planets ---------- */
const EARTH={id:'earth',g:6,dens:a=>Math.exp(-Math.max(0,a)/700),ground:x=>Math.abs(x)<=13?22:0};
const MARS_X0=-3000,MARS_STEP=10,MARS_N=900;
const ZONES=[{x0:-380,x1:-280},{x0:330,x1:430},{x0:860,x1:1040,base:true},{x0:1040,x1:1220,ice:true},{x0:1220,x1:1400,base:true},{x0:1850,x1:1960},{x0:2700,x1:2800,ice:true}];
const marsArr=new Float32Array(MARS_N);
(function genMars(){
  const s=[rnd(0,6),rnd(0,6),rnd(0,6),rnd(0,6)];
  for(let i=0;i<MARS_N;i++){
    const x=MARS_X0+i*MARS_STEP;
    let h=38*Math.sin(x/310+s[0])+22*Math.sin(x/97+s[1])+9*Math.sin(x/37+s[2])+4*Math.sin(x/13+s[3]);
    marsArr[i]=h;
  }
  // Jezero Base plateau: one flat shelf around the ice field
  {const lvl=marsAt(1130);for(let i=0;i<MARS_N;i++){const x=MARS_X0+i*MARS_STEP;if(x>=860&&x<=1400)marsArr[i]=lvl;else{const d=x<860?860-x:x-1400;if(d<80){const t=d/80;marsArr[i]=lerp(lvl,marsArr[i],t*t*(3-2*t))}}}}
  for(const z of ZONES){
    const c=(z.x0+z.x1)/2,lvl=marsAt(c);
    for(let i=0;i<MARS_N;i++){
      const x=MARS_X0+i*MARS_STEP;
      if(x>=z.x0&&x<=z.x1)marsArr[i]=lvl;
      else{const d=x<z.x0?z.x0-x:x-z.x1; if(d<60){const t=d/60;marsArr[i]=lerp(lvl,marsArr[i],t*t*(3-2*t));}}
    }
  }
})();
function marsAt(x){const f=(x-MARS_X0)/MARS_STEP;const i=clamp(Math.floor(f),0,MARS_N-2);const t=clamp(f-i,0,1);return lerp(marsArr[i],marsArr[i+1],t)}
const MARS={id:'mars',g:2.3,dens:a=>0.12*Math.exp(-Math.max(0,a)/900),ground:marsAt};
const zoneAt=x=>ZONES.find(z=>x>=z.x0+4&&x<=z.x1-4);

/* ---------- scenery ---------- */
const stars=Array.from({length:220},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.4+.3,a:Math.random()*.6+.4}));
let rocks=Array.from({length:160},()=>{const x=rnd(-2900,5900);return{x,r:rnd(1.5,6)}}).filter(r=>!zoneAt(r.x));

/* ---------- state ---------- */
const ENG={
  SL:{name:'SL',thrust:4.6,fuelAtm:.6,fuelVac:.75},
  VAC:{name:'VAC',thrustVac:5.2,thrustAtm:1.8,fuel:.6}
};
let hangar=null;
let ship=null;      // persistent between phases
let S={phase:'menu',paused:true,cp:null,cpPhase:null,clock:0};
let body=null,booster=null,debris=null,tr=null,mining=null,planet=EARTH;
let particles=[];
let cam={x:0,y:0,z:1};
let mode='ALL';
const keys={left:false,right:false,thrust:false,zin:false,zout:false,mine:false};
let userZoom=1;
function zoomBy(f){userZoom=clamp(userZoom*f,0.3,10);$('zFit').textContent=Math.abs(userZoom-1)<.05?'AUTO':'×'+userZoom.toFixed(1)}
let actEdge=false,thrEdge=false,prevThr=false;

function newShip(){return{rk:RK.id,chute:1,integ:100,samples:0,cargo:cargoSel,mid:Date.now()+Math.random(),fuel:100,kits:0,engines:hangar.map(t=>({type:t,dmg:false,heat:0})),stats:{lost:0,mined:0,start:0}}}

/* ---------- colony: Jezero Base, kept in this browser ---------- */
const BASE_X=1130,PAD_X0=1104,PAD_X1=1156;
// Each delivery of the same module type upgrades that building, up to level 3
const MODS={
  hab:{name:'Habitat',short:'Habitat',x:1004,w:[18,24,30],shelter:true,crew:[4,8,14],desc:'Crew quarters and storm shelter. Each level: +1 repair kit and hull repairs on landing.'},
  depot:{name:'Propellant depot',short:'Depot',x:961,w:[12,18,24],desc:'Spare methane and oxygen. Each level: +15% fuel on landing.'},
  green:{name:'Greenhouse',short:'Greenhouse',x:923,w:[14,20,26],shelter:true,crew:[1,2,3],desc:'Food and a storm shelter. +1 star on your mission rating.'},
  garage:{name:'Rover garage',short:'Garage',x:880,w:[18,24,30],shelter:true,desc:'Storm shelter with fast chargers. Each level: quicker charging and +15% rover speed.'},
  solar:{name:'Solar farm',short:'Solar farm',x:1268,w:[18,26,34],desc:'Powers the base. Each level: +50% refining speed and rover charging nearby.'},
  comms:{name:'Comms relay',short:'Comms',x:1312,w:[8,10,12],desc:'Deep-space dish. No telemetry dropouts. Each level: 20 s more storm warning.'},
  rig:{name:'Ice drilling rig',short:'Drill rig',x:1350,w:[12,16,20],desc:'Automated subsurface ice drill piped to the pad. Each level: fuel trickles into your ship on the surface.'},
  pad:{name:'Landing pad',short:'Landing pad',x:BASE_X,w:[52,52,52],max:1,desc:'Graded pad on the ice field with approach lights. Looser touchdown limits on it.'}
};
let colony={mods:[],samples:0};
try{const c=JSON.parse(localStorage.getItem('mrt.colony')||'null');if(c&&Array.isArray(c.mods)){colony=c;colony.mods=colony.mods.filter(m=>MODS[m.t]);colony.samples=colony.samples||0}}catch(e){}
for(const k of['landings','builds','bprog'])colony[k]=colony[k]||0;
function colSave(){try{localStorage.setItem('mrt.colony',JSON.stringify(colony))}catch(e){}cloudWrite('colony',{json:JSON.stringify(colony)})}
const modMax=t=>MODS[t].max||3;
let PV=null; // preview override: {type:level} while painting cargo art
const colN=t=>PV&&t in PV?PV[t]:MODS[t]?Math.min(modMax(t),colony.mods.filter(m=>m.t===t).length):0;   // building level, 0 = not built
const colBuilt=()=>Object.keys(MODS).filter(k=>colN(k));
const colCrew=()=>colBuilt().reduce((a,k)=>a+(MODS[k].crew?MODS[k].crew[colN(k)-1]:0),0)+(colBuilt().length?2:0);
const modW=t=>MODS[t].w[Math.max(0,colN(t)-1)];
const modX=t=>MODS[t].x;
function colDeliver(t,mid){
  if(!t||!MODS[t])return null;
  if(colony.mods.some(m=>m.mid===mid))return null;
  if(colN(t)>=modMax(t))return null;
  const m={t,mid,at:Date.now()};colony.mods.push(m);colSave();return m;
}
// building whose footprint covers x (optionally only storm shelters)
function modAt(x,shelterOnly,pad){
  for(const k of colBuilt()){if(k==='pad'||shelterOnly&&!isShelter(k))continue;if(Math.abs(x-modX(k))<modW(k)/2+(pad||0))return k}
  return null;
}
let cargoSel=Object.keys(MODS).find(k=>colN(k)<modMax(k))||'hab';

/* ---------- saving: your Claude account when available, this browser as a fallback ---------- */
const SAVE={db:null,uid:null,cloud:false,game:null,busy:{},pend:{}};
try{SAVE.game=JSON.parse(localStorage.getItem('mrt.save')||'null')}catch(e){}
function cloudWrite(name,data){
  if(!SAVE.db||!SAVE.uid)return;
  if(SAVE.busy[name]){SAVE.pend[name]=data;return}
  SAVE.busy[name]=true;
  const ref=SAVE.db.doc(`data/users/${SAVE.uid}/${name}`);
  (data?ref.set(data):ref.delete()).catch(()=>{}).finally(()=>{SAVE.busy[name]=false;if(name in SAVE.pend){const d=SAVE.pend[name];delete SAVE.pend[name];cloudWrite(name,d)}});
}
function saveGame(){
  if(!S.cp||!S.cpPhase||S.cpPhase==='school')return;
  SAVE.game={v:1,at:Date.now(),cp:S.cp,cpPhase:S.cpPhase,rk:RK.id,clock:S.clock,loadouts};
  try{localStorage.setItem('mrt.save',JSON.stringify(SAVE.game))}catch(e){}
  cloudWrite('game',{json:JSON.stringify(SAVE.game)});
}
function clearGame(){SAVE.game=null;try{localStorage.removeItem('mrt.save')}catch(e){}cloudWrite('game',null)}
function continueGame(){
  const g=SAVE.game;if(!g)return;
  if(g.loadouts)for(const k in g.loadouts)if(loadouts[k])loadouts[k]=g.loadouts[k];
  setRocket(g.rk||g.cp.rk||'starship');ship=clone(g.cp);S.cp=clone(g.cp);S.cpPhase=g.cpPhase;S.clock=g.clock||0;
  buildEngChips();menuBg();briefing(g.cpPhase);
}
function mergeColony(a,b){
  const seen=new Set(),mods=[];for(const m of[...(a.mods||[]),...(b.mods||[])]){const k=m.mid+':'+m.t;if(!seen.has(k)&&MODS[m.t]){seen.add(k);mods.push(m)}}
  return{mods,samples:Math.max(a.samples||0,b.samples||0),landings:Math.max(a.landings||0,b.landings||0),builds:Math.max(a.builds||0,b.builds||0),bprog:Math.max(a.bprog||0,b.bprog||0),
    settlers:((a.settlers||[]).length>=(b.settlers||[]).length?a.settlers:b.settlers),dome:[a.dome,b.dome].filter(Boolean).sort((x,y)=>(y.stage+y.p)-(x.stage+x.p))[0],scout:a.scout||b.scout,focus:a.focus||b.focus,subSeed:a.subSeed||b.subSeed,dugStr:(a.dugStr||'').length>=(b.dugStr||'').length?a.dugStr:b.dugStr,braceStr:a.braceStr||b.braceStr,shields:(a.shields||[]).length>=(b.shields||[]).length?a.shields:b.shields,mat:a.mat||b.mat,tubes:Math.max(a.tubes||0,b.tubes||0),research:Math.max(a.research||0,b.research||0),solarDust:a.solarDust??b.solarDust,food:a.food??b.food,sol:Math.max(a.sol||0,b.sol||0)||undefined,lastMid:a.lastMid||b.lastMid};
}
// connect to the account store once the viewer answers; reconcile with what this browser had
(async()=>{
  try{
    let tries=0;while(!(window.claude&&window.claude.use)&&tries++<20)await new Promise(r=>setTimeout(r,150));
    if(!(window.claude&&window.claude.use))return;
    const [u,db]=await Promise.all([window.claude.use('user'),window.claude.use('db')]);
    if(!u||!db)return;const id=await u.id();if(!id)return;
    SAVE.db=db;SAVE.uid=id;
    const [g,c]=await Promise.all([db.doc(`data/users/${id}/game`).get(),db.doc(`data/users/${id}/colony`).get()]);
    SAVE.cloud=true;
    if(c.exists){try{const cc=JSON.parse(c.data().json||'{}');colony=mergeColony(colony,cc);migrateColony();try{localStorage.setItem('mrt.colony',JSON.stringify(colony))}catch(e){}}catch(e){}}
    cloudWrite('colony',{json:JSON.stringify(colony)});
    if(g.exists){try{const gg=JSON.parse(g.data().json||'null');if(gg&&(!SAVE.game||gg.at>SAVE.game.at)){SAVE.game=gg;try{localStorage.setItem('mrt.save',JSON.stringify(gg))}catch(e){}}}catch(e){}}
    else if(SAVE.game)cloudWrite('game',{json:JSON.stringify(SAVE.game)});
    if(S.phase==='menu'&&!$('ov').hidden&&$('start'))menu();
  }catch(e){}
})();

/* ---------- anomalies: things that go wrong now and then ---------- */
const pickLive=()=>{const l=ship.engines.filter(e=>!e.dmg);return l[Math.floor(Math.random()*l.length)]};
const ANOM={
  launch:[
    {w:[5,12],stacked:true,title:'Booster engine out',cap:'Flight, we have an engine out on the booster. Remaining engines are compensating.',fx(){booster.lost=(booster.lost||0)+1;sfx('crack');burst({x:body.x,y:body.y-58},16,['#ffb04a','#ff5a1a','#666'])}},
    {w:[6,15],title:'Wind shear',cap:'Wind shear at altitude. Expect the vehicle to kick. Hold your attitude.',fx(){S.shear={t:3.5,dir:Math.random()<.5?-1:1}}},
    {w:[20,34],ship:true,title:'Methane leak',cap:'We are seeing a methane leak on the ship. Isolating the line. Expect some propellant loss.',fx(){S.leak={t:12}}}
  ],
  transfer:[
    {w:[3,9],title:'Micrometeoroid strike',cap:'Possible micrometeoroid strike on the aft tank. We have lost some propellant.',fx(){ship.fuel=Math.max(0,ship.fuel-4);sfx('crack')}},
    {w:[2,8],tele:true,title:'Solar flare',cap:'Solar particle event in progress. Crew to the storm shelter. Expect telemetry dropouts.',fx(){S.blackout=7}}
  ],
  marsLand:[
    {w:[8,20],title:'Dust devil',cap:'Dust devil crossing the landing zone. Watch your drift.',fx(){S.devil={t:7,dir:Math.random()<.5?-1:1}}},
    {w:[6,16],tele:true,title:'Landing radar fault',cap:'Radar altimeter dropout. You will have to fly it by eye.',fx(){S.blackout=8}}
  ],
  mining:[
    {w:[25,50],title:'Storm moving faster',cap:'Weather update. The dust storm is moving faster than forecast. You have lost fifteen seconds.',fx(){mining.storm-=15}},
    {w:[12,40],title:'Rover motor fault',cap:'Rover front motor is overheating. Power limited for ten seconds.',fx(){mining.slow=10}}
  ],
  marsAscent:[
    {w:[1,4],title:'Hard start',cap:'Hard start on one engine. Watch your temperatures.',fx(){const e=pickLive();if(e)e.heat=Math.min(96,e.heat+60);sfx('crack')}}
  ],
  reentry:[
    {w:[4,12],title:'Forward flap stuck',cap:'Forward flap actuator is not responding. Counter the roll by hand.',fx(){S.flap={t:9,tq:(Math.random()<.5?-1:1)*1.1};sfx('servo')}},
    {w:[2,8],title:'Heat shield tile lost',cap:'Looks like we shed a heat shield tile. Hull temperatures will run hot.',fx(){S.tile=1.3}}
  ]
};
function planAnomaly(name){
  S.an=null;S.pt=0;
  const key=name==='toMars'||name==='toEarth'?'transfer':name;
  const list=(ANOM[key]||[]).filter(a=>!(a.tele&&colN('comms')));
  if(!list.length||Math.random()>.45)return;
  const a=list[Math.floor(Math.random()*list.length)];S.an={a,at:rnd(a.w[0],a.w[1]),done:false};
}
function stepAnomaly(dt){
  S.pt=(S.pt||0)+dt;const an=S.an;if(!an||an.done||S.pt<an.at)return;
  const a=an.a;
  if(a.stacked&&!(body&&body.stacked))return;
  if(a.ship&&body&&body.stacked)return;
  an.done=true;a.fx();callout(a.cap,true);toast(a.title,'var(--bad)');
}

/* ---------- audio: synthesised engines, comms tones and callouts ---------- */
const AU={ctx:null,on:true,voice:true,vname:'',last:{}};
try{const p=JSON.parse(localStorage.getItem('mrt.audio')||'{}');if(p.on===false)AU.on=false;if(p.voice===false)AU.voice=false;if(p.vname)AU.vname=p.vname}catch(e){}
function auSave(){try{localStorage.setItem('mrt.audio',JSON.stringify({on:AU.on,voice:AU.voice,vname:AU.vname}))}catch(e){}}
// pick the most natural free voice this device offers: Edge/Windows neural, Google, Apple premium/enhanced, then any English
function voiceScore(v){

    u.rate=neural?1.04:1.07;u.pitch=neural?1:.92;u.volume=.95;if(v){u.voice=v;u.lang=v.lang}

    air=S.phase==='leo'||leo?0:clamp(planet===EARTH?EARTH.dens(alt):MARS.dens(alt)/0.12*0.55,0,1);

const workingCount=type=>ship.engines.filter(e=>e.type===type&&!e.dmg).length;

function buildEngChips(){
  const box=$('engs');box.innerHTML='';box.style.gridTemplateColumns=`repeat(${ship.engines.length},1fr)`;
  const counts={SL:0,VAC:0};
  ship.engines.forEach((e,i)=>{

    b.className='eng '+e.type.toLowerCase();b.dataset.i=i;
    b.innerHTML=`<span class="vbar"><i></i></span><span class="t">${e.type==='VAC'?'V':'S'}${counts[e.type]}</span>`;b.title=`${e.type}-${counts[e.type]}`;

function repair(i){
  if(S.phase!=='mining')return;
  const e=ship.engines[i];
  if(!e.dmg){toast('That engine is fine');return}
  if(ship.kits<1){toast('No repair kits — haul hematite to the refinery','var(--warn)');return}
  ship.kits--;e.dmg=false;e.heat=0;toast(`${e.type} engine repaired`,'var(--ok)');

function runEngines(dt,firingAllowed){
  const dens=S.phase==='leo'?0:planet.dens(body?body.y:0);
  const atm=dens>0.25;
  let acc=0,anyFire=false;const f0=ship.fuel;
  const want=keys.thrust&&firingAllowed&&ship.fuel>0;
  for(const e of ship.engines){
    e.firing=false;
    if(want&&!e.dmg&&(mode==='ALL'||mode===e.type)){
      e.firing=true;anyFire=true;
      if(e.type==='SL'){acc+=ENG.SL.thrust;ship.fuel-=(dens<0.1?ENG.SL.fuelVac:ENG.SL.fuelAtm)*dt;e.heat+=(atm?4.6:3.6)*RK.heat*dt}
      else{acc+=atm?ENG.VAC.thrustAtm:ENG.VAC.thrustVac;ship.fuel-=ENG.VAC.fuel*dt;e.heat+=(atm?22:4)*RK.heat*dt}
    }else e.heat-=(atm?11:9)*dt;
    e.heat=clamp(e.heat,0,100);
    if(e.heat>=100&&!e.dmg){
      e.dmg=true;ship.stats.lost++;
      const n=ship.engines.filter(x=>x.type===e.type).indexOf(e)+1;
      toast(`${e.type}-${n} overheated — engine out`,'var(--bad)');sfx('alarm');sfx('crack');
      burst(engineWorld(ship.engines.indexOf(e)),18,['#ffb04a','#ff5a1a','#555']);
    }
  }
  if(ship.fuel<=0){ship.fuel=0}
  ship.fuel=f0-(f0-ship.fuel)*RK.fuel*(S.phase==='reentry'||S.phase==='school'?.55:1);if(ship.fuel<0)ship.fuel=0;
  return {acc:acc*RK.thrust*(1+0.35*(1-ship.fuel/100)),anyFire};
}

function briefing(name){
  const p=PHASES[name];
  const sl=workingCount('SL'),vac=workingCount('VAC');
  let body='',warn='';
  if(name==='school'){
    body=`<figure class="demo"><img src="${DEMO_WEBP}" alt="Demo flight: lift off, climb to 500 m, cut thrust, fall back and get caught by the tower"><figcaption>WATCH A HOP · 10 SECONDS</figcaption></figure><p>Before Mars, prove you can fly the ship home. Lift off the launch mount, climb to <b>500 m</b>, then fall back and let the <b>tower's chopstick arms</b> catch you, the way Port Meridian catches its rockets.</p>
    <ul><li>Hold <b>Thrust</b> (↑ or Space) to climb. Tap <b>◀ ▶</b> to tilt. Small taps.</li>
    <li>You start on <b>SL</b> (sea-level) engines only. VAC engines overheat in thick air, so leave the engine mode alone down here.</li>
    <li>At 500 m let go of Thrust and fall. Line up over the mount, just right of the tower.</li>
    <li>Light the engines again to slow down. Get under <b>4 m/s</b>, upright, inside the green <b>catch zone</b> between the arms.</li>
    <li>A soft landing on the launch mount also passes. Watch the prompts and the HUD.</li></ul>`;
  }else if(name==='launch'){
    body=`<p>Goliath lifts you off the pad. Hold <b>Thrust</b>, then tip gently to the right to build sideways speed. Orbit is <b>2,200 m up</b> and <b>280 m/s sideways</b>.</p>
    <ul><li>Watch the <b>booster heat</b>. Push through max-Q too hard and you lose engines.</li>
    <li>Hit <b>Stage</b> when the booster runs dry, then the ship's own engines take over.</li>
    <li><b>VAC</b> engines overheat fast in thick air. Fire <b>SL</b> only until the sky goes dark, then switch.</li>
    <li>Expect turbulence through max-Q. Now and then something breaks. Mission control will call it.</li>
    <li>High up, SkyMesh trains cross the corridor. Hitting one damages the hull.</li></ul>`;
  }else if(name==='leo'){
    body=`<p>You're in a parking orbit. Mars is only reachable when Earth and Mars line up, so the <b>departure window</b> opens once per orbit. When it opens, point the nose <b>prograde</b> (the direction you're orbiting, marked on the ring) and hold <b>Thrust</b> for the trans-Mars injection burn.</p>
    <ul><li>The burn needs ${TMI_DV} m/s of Δv. Pointing off prograde wastes fuel. VAC engines get it done on the least propellant, so try VAC only.</li>
    <li>Run out of window and you finish the burn on the next pass.</li>
    <li>Between windows the engines throttle right down for manoeuvring. Space is frictionless: thrust to move, turn round and thrust to stop.</li>
    <li>Asteroids: park beside one, match its speed (under 2.5 m/s) and hold <b>Mine</b> (or M). Grey-blue ice rocks give fuel, brown metal rocks give repair kits.</li>
    <li>Debris and SkyMesh trains hurt. Hull damage stays for the whole trip and makes reentry hotter. A habitat on Mars can patch it.</li></ul>`;
  }else if(name==='toMars'&&ship.tmi){
    body=`<p>The injection burn put you on a Hohmann transfer orbit: half an ellipse around the Sun that meets Mars on the far side. Seven months of coasting, squeezed into a few seconds.</p>`;
  }else if(name==='toMars'||name==='toEarth'){
    const tgt=name==='toMars'?'Mars':'Earth';
    body=`<p>Wait for ${tgt} to drift into the <b>green arc</b>, then tap <b>Burn</b>. Dead centre costs least fuel. Edge of the arc costs up to 60% more.</p>
    <ul><li>Estimated cost: <b>${Math.round(transferBase())}%</b> fuel at a perfect burn. You have <b>${Math.round(ship.fuel)}%</b>.</li>
    <li>Working VAC engines: <b>${vac}</b>. With none left the burn costs almost double.</li></ul>`;
    if(transferBase()>ship.fuel)warn=`You can't afford this burn even if it's perfect. Retry the previous phase or restart.`;
  }else if(name==='marsLand'){
    body=`<p>You're coming in fast over Jezero-style terrain. Kill your sideways speed and set down on the <b>ice field</b> (white, ~1.1 km ahead). Thin air, low gravity, very little drag.</p>
    <ul>${firstMission()?`<li><b>First crewed landing.</b> Six aboard. SCOUT-1, the robotic rover that's been here for years, has set a <b>green beacon</b> on the ice field. Land next to it.</li>`:''}
    <li>Touch down <b>upright</b>, under <b>5 m/s</b> down and <b>4 m/s</b> sideways.</li>
    <li>Only flat ground is safe. Boulders tip you over.</li>
    ${colBuilt().length?`<li><b>Jezero Base</b> sits around the ice field. Don't land on the modules.${colN('pad')?' The landing pad in the middle has looser limits.':''}</li>`:''}
    <li>Landing off the ice still works, but the rover has further to drive for water.</li>
    <li><b>Emergency chute</b> (tap <b>Chute</b>, or P): one use. Opens below 85 m/s and lowers you anywhere at about 6 m/s, but the thump wrecks engines: 1 on a landing zone, 2 on boulders.</li></ul>`;
  }else if(name==='mining'){
    body=`${colony.dome&&!domeReady()?`<p><b>The settlers are building the Geo-dome.</b> Watch the checklist top left. They work by hand, step by step, and stop for storms. It doesn't need you, but you need fuel to get home.</p>`:''}<p>Open the cargo ramp and drive the <b>rover</b> out. Dig ice and hematite and bring it back up the ramp: stowing the rover feeds the <b>refinery</b>, which turns ice plus CO₂ into methane and oxygen, and hematite into repair kits.</p>
    <ul><li>Dust storms come and go. When one hits, the rover must be in the ship or a base shelter (habitat, greenhouse or garage), or the crew is in trouble.</li>
    <li>The rover runs on batteries. It recharges in the ship, in shelters and near the solar farm.</li>
    <li>There's more ice further out, and Endurance's sample tubes are somewhere on the delta. Bring them home.</li>
    <li>Fuel needed to get home: <b>${homeNeed()}%</b>. You have <b>${Math.round(ship.fuel)}%</b>. You can't launch into a storm.</li></ul>`;
  }else if(name==='marsAscent'){
    body=`${(colony.landings||0)===1?`<p><b>Two of you go home.</b> You and ${COPILOT} lift off; ${colPop()} settlers stay at Jezero${domeReady()?' in the Geo-dome':', still finishing the Geo-dome'}. The ship carries life support for the two of you for the seven-month coast home.</p>`:''}<p>Climb back to Mars orbit: <b>1,000 m up</b> and <b>110 m/s sideways</b>. Gravity is a third of Earth's, so go easy on the throttle.</p>`;
  }else if(name==='reentry'){
    body=`<p>You hit the atmosphere at 150 m/s. Keep the <b>dark heat shield</b> facing the way you're travelling, side-on to the arrow showing your direction of travel. Green arrow means the shield is doing its job. Point the nose or the steel side into the airflow and the hull cooks.</p>
    <ul><li>Steer distance with your angle: fully side-on brakes hardest, tilting toward the arrow glides further but runs hotter.</li>
    <li>Near the ground, <b>flip upright</b> and burn the <b>SL</b> engines. Settle onto the launch mount, or hover into the <b>chopsticks</b> on the tower for a catch and bonus stars.</li>
    <li>Working SL engines: <b>${sl}</b>. VAC engines are weak down here.</li></ul>`;
    if(sl<2)warn='Fewer than 2 working SL engines. The landing burn will be very marginal.';
  }
  if(name!=='school')body=body.replace(/<ul>([\s\S]*?)<\/ul>/,'<details class="more"><summary>More detail</summary><ul>$1</ul></details>');
  show(`<div class="eyebrow">${name==='school'?'Training flight':'Phase '+p.num}</div><h2>${p.title}</h2>${body}${warn?`<div class="warnline">${warn}</div>`:''}
    <div class="btns"><button class="btn" id="go">${name==='toMars'&&ship.tmi?'Coast to Mars':name.startsWith('to')?'Plot the burn':'Go'}</button></div>`);
  $('go').onclick=()=>{hide();begin(name)};
  setTimeout(()=>$('go')&&$('go').focus(),30);
}

function checkpoint(name){S.cp=clone(ship);S.cpPhase=name;saveGame();briefing(name)}
function resetRun(){
  releaseInputs();S.failing=false;S.catchAnim=null;S.catching=false;S.school=S.cpPhase==='school'?null:S.school;
  mining=null;leo=null;tr=null;debris=null;booms=[];particles=[];rampLane=false;S.shake=0;S.flash=0;S.blackout=0;S.sats=[];
}
function retry(){ship=clone(S.cp);setRocket(ship.rk||RK.id);buildEngChips();briefing(S.cpPhase)}

function begin(name){
  S.phase=name;S.paused=false;S.failing=false;S.catching=false;S.catchAnim=null;S.shear=S.flap=S.leak=S.devil=null;S.tile=1;S.blackout=0;S.f={};S.count=0;planAnomaly(name);
  document.body.classList.toggle('surface',name==='mining');$('sideL').hidden=name==='mining';$('zoom').hidden=name.startsWith('to');particles=[];debris=null;tr=null;mining=null;booms=[];if(!['marsLand','mining','marsAscent'].includes(name))colonists=null;S.sats=null;S.satT=undefined;if(name!=='leo')leo=null;
  for(const e of ship.engines){e.heat=0;e.firing=false}
  keys.thrust=keys.left=keys.right=false;
  $('hud').hidden=false;$('mine').hidden=true;$('ctl').hidden=false;
  mode='ALL';updMode();

function stage(){
  if(S.phase!=='launch'||!body.stacked||body.dead)return;
  const b=body,s=Math.sin(b.ang),c=Math.cos(b.ang);
  const off=35;
  debris={x:b.x-25*s*.99-35*s*0+(-25)*s,y:b.y+(-25)*c,vx:b.vx,vy:b.vy,ang:b.ang,av:0,t:0,dry:booster.fuel<=0};
  debris.x=b.x+(-25)*s;debris.y=b.y+(-25)*c;
  b.x+=off*s;b.y+=off*c;b.stacked=false;
  $('bAct').disabled=true;$('xtra').hidden=$('xtra2').hidden=true;

function stepDebris(dt){
  const d=debris;if(!d)return;
  d.t+=dt;
  const dens=EARTH.dens(d.y),v=Math.hypot(d.vx,d.vy)||1;
  let ax=0,ay=-EARTH.g;
  if(d.t>1.5&&d.t<5){ // boostback
    const target=Math.PI/2*-1;d.ang+=clamp(wrap((target-d.ang)*57.3)/57.3,-1,1)*dt*1.5;
    ax+=Math.sin(d.ang)*9;ay+=Math.cos(d.ang)*9;d.fire=true;
  }else d.fire=false;
  const dr=dens*v*v*0.0015;ax-=dr*d.vx/v;ay-=dr*d.vy/v;
  d.vx+=ax*dt;d.vy+=ay*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;
  if(d.y<0||d.t>14)debris=null;
}

/* ---------- transfer ---------- */
function stepTransfer(dt){
  const t=tr;
  const wE=55,wM=28;
  t.eA+=wE*dt;t.mA+=wM*dt;
  if(t.state==='wait'){
    if(thrEdge&&S.blackout>0){toast('No signal — wait for telemetry','var(--warn)');return}
    if(thrEdge){
      const phase=t.toM?wrap(t.mA-t.eA):wrap(t.eA-t.mA);
      const dev=wrap(phase-t.ideal);
      if(Math.abs(dev)>20){toast('No intercept — wait for the arc','var(--warn)');return}
      const cost=transferBase()*(1+0.6*Math.abs(dev)/20);
      if(cost>ship.fuel){toast('Not enough fuel','var(--bad)');fail({t:'Stranded in orbit',d:`That burn needed ${Math.round(cost)}% fuel and you had ${Math.round(ship.fuel)}%. Mine more fuel or keep your VAC engines alive.`});return}
      ship.fuel-=cost;
      t.cost=cost;t.dev=dev;t.state='fly';t.t=0;t.th0=t.toM?t.eA:t.mA;
      t.dur=t.toM?136/wM:255/wE;
      toast(Math.abs(dev)<5?'Perfect burn':`Burn complete — ${Math.round(cost)}% fuel`,Math.abs(dev)<5?'var(--ok)':'var(--fg)');
      ship.engines.forEach(e=>{if(!e.dmg&&e.type==='VAC')e.firing=true});
      callout(t.toM?'Trans-Mars injection burn complete. Next stop, Jezero.':'Trans-Earth injection complete. We are coming home.');
    }
  }else if(t.state==='fly'){
    t.t+=dt;
    if(t.t>0.8)ship.engines.forEach(e=>e.firing=false);
    if(t.t>=t.dur){t.state='done';S.phase='coast';toast(t.toM?'Arriving at Mars':'Arriving at Earth','var(--ok)');setTimeout(()=>checkpoint(t.toM?'marsLand':'reentry'),1300)}
  }
}

function launchFromMars(){
  if(S.phase!=='mining')return;
  if(mining.eva){toast('Get back aboard first','var(--warn)');return}
  if(!roverHome()){toast('Stow the rover or shelter it first','var(--warn)');return}
  if(mining.stormOn){toast("Can't launch into a dust storm",'var(--warn)');return}
  colSave();
  callout(mining.rover==='shelter'?'Rover stays at Jezero Base. Mars ascent, you are go.':'Rover is stowed. Mars ascent, you are go.');
  checkpoint('marsAscent');
}

  stepBooms(dt);if(S.flash>0)S.flash-=dt*2.2;if(S.deluge>0)S.deluge-=dt;
  if(S.phase==='dead'&&body&&!body.dead&&!tr){} // frozen
  stepParticles(dt);
  if(tr&&(S.phase==='toMars'||S.phase==='toEarth'||S.phase==='coast'))drawTransfer();
  else{
    // camera
    if(S.phase==='mining'&&mining){
      const m=mining,ev=m.eva,out=!ev&&m.rover==='out'&&m.bg,watch=!ev&&!out&&m.rover!=='shelter'&&colony.dome&&!domeReady();
      const fx=watch?(colony.dome.stage===0?(m.crateX??body.x):DOME_X):0; // frame the ship and the crew's work site together
      const tx=ev?ev.x+ev.dir*2:out?m.bg.x+m.bg.vx*.9:m.rover==='shelter'?modX(m.shelter):watch?(body.x+fx)/2:body.x+6,ty=ev?ev.y+2.5:out?m.bg.y+7:marsAt(tx)+(m.rover==='shelter'?9:watch?12:16);
      const zt=ev?sScale()*15*userZoom:watch?Math.min(sScale()*3.3,(W*.8)/(Math.abs(body.x-fx)+46))*userZoom:sScale()*(out?5.2:3.3)*userZoom;
      cam.z=cam.z?lerp(cam.z,zt,Math.min(1,dt*2.5)):zt;
      cam.lx=lerp(cam.lx??tx,tx,Math.min(1,dt*2.4));cam.ly=lerp(cam.ly??ty,ty,Math.min(1,dt*2.4));cam.x=cam.lx;cam.y=cam.ly;
    }else if(leo&&(S.phase==='leo'||S.phase==='coast')&&body){
      const zt=Math.min(sScale()*.72*1.6*userZoom,leoZoomNeed());cam.z=cam.z?lerp(cam.z,zt,Math.min(1,dt*(zt<cam.z?3:1.2))):zt;cam.x=body.x;cam.y=body.y;cam.lx=cam.ly=undefined;
    }else if(body){
      cam.lx=cam.ly=undefined;
      const g=planet.ground(body.x);const alt=Math.max(0,body.y-g);
      const zt=sScale()*clamp(380/(alt*0.5+300),0.16,1.25)*userZoom;
      cam.z=cam.z?lerp(cam.z,zt,Math.min(1,dt*2.5)):zt;
      const gl=planet===EARTH?0:g;cam.x=body.x;cam.y=Math.max(body.y,gl+(H*0.58-130)/cam.z);
    }
    drawWorld(cam.z||1);
  }
  if(capT>0){capT-=dt;if(capT<=0)$('capcom').classList.remove('on')}
  const sh=reduceMotion||S.paused?0:(S.shake||0);S.shake=(S.shake||0)*Math.pow(.04,dt);
  cv.style.transform=sh>.03?`translate(${((Math.random()-.5)*sh*7).toFixed(1)}px,${((Math.random()-.5)*sh*7).toFixed(1)}px) scale(1.02)`:'';
  auUpdate();
  hud();
  requestAnimationFrame(frame);
}

// label cache for chips

buildEngChips=function(){_build();[...$('engs').children].forEach(c=>c.dataset.lbl=c.querySelector('.t').textContent)};

/* ---------- boot ---------- */
window.claude?.hot?.snapshot?.(()=>({cp:S.cp,cpPhase:S.cpPhase,rk:RK.id,clock:S.clock}));
function boot(d){
  migrateColony();
  if(d&&d.cp&&d.cpPhase){setRocket(d.rk||d.cp.rk||'starship');S.clock=d.clock||0;S.cp=d.cp;S.cpPhase=d.cpPhase;ship=clone(d.cp);buildEngChips();menuBg();briefing(d.cpPhase)}
  else menu();
  requestAnimationFrame(t=>{last=t;frame(t)});
}
function menuBg(){body={x:0,y:82,vx:0,vy:0,ang:0,av:0,stacked:true,grounded:true};planet=EARTH}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
